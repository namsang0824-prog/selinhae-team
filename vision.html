<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>셀인해 1년 비전 발표</title>
<style id="deck-style">
/* Layout: 편집 = 실제 크기 슬라이드를 세로로 쌓고 글자를 직접 눌러 수정. 발표(#present / #show) = 16:9 스테이지 + 클릭 단계 등장 + 항목 강조. 단일 라이트 테마(셀인해 브랜드 팔레트). */
@font-face { font-family: "Paperlogy"; src: url("/_blob/2b9d6fb1f206a8678713c07e843b1ea0") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Paperlogy"; src: url("/_blob/40638890322af65f2ddfc51bdc85119b") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Paperlogy"; src: url("/_blob/627052d3aa27e66b1c0a36252081a05a") format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Pretendard"; src: url("/_blob/44fdbc3afd891534467cdaf82c1a7a6d") format("woff2-variations"), url("/_blob/44fdbc3afd891534467cdaf82c1a7a6d") format("woff2"); font-weight: 45 920; font-display: swap; }
:root {
  --brand: #FF407C;
  --brand-soft: #FFEBF1;
  --ink: #191F28;
  --sub: #8B95A1;
  --sub-strong: #404654;
  --card: #F3F6F8;
  --bg: #FFFFFF;
  --line: #E5E8EB;
  --line-strong: #D1D6DB;
  --danger: #E5484D;
  --f-display: "Paperlogy", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hl { font-style: normal; color: var(--brand); }

/* ───────── 편집 화면 ───────── */
.ed-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.ed-bar-in { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.ed-name { flex: 1 1 240px; min-width: 0; margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.ed-name small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--sub); }
.ed-state { font-size: 12.5px; color: var(--sub); }
.ed-state.dirty { color: var(--brand); font-weight: 600; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; }
.btn:hover { border-color: var(--sub); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--sub-strong); }
.btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.ed-main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; display: flex; flex-direction: column; gap: 22px; }
.ed-intro { margin: 0; font-size: 13.5px; color: var(--sub-strong); max-width: 72ch; }
.ed-intro code { font-family: var(--f-body); background: var(--card); border-radius: 4px; padding: 0 5px; color: var(--brand); font-weight: 600; }
.banner { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13.5px; }
.banner p { margin: 0; flex: 1 1 240px; min-width: 0; }
.notice { font-size: 13px; color: var(--sub-strong); background: var(--card); border-radius: 10px; padding: 10px 12px; margin: 0; }
.notice.err { color: var(--danger); }
.panel { background: var(--card); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.panel p { margin: 0; font-size: 13px; color: var(--sub-strong); }
.panel textarea, .adv textarea { width: 100%; min-height: 200px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.st-text { font-size: 13px; color: var(--brand); }
.st-text.err { color: var(--danger); }
.link-box { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

.deck-list { display: flex; flex-direction: column; gap: 40px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.card-no { font-family: var(--f-display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.card-tag { font-size: 12px; font-weight: 600; color: var(--sub-strong); background: var(--card); border-radius: 6px; padding: 2px 8px; }
.card-sp { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub-strong); }
.toggle input { accent-color: var(--brand); width: 16px; height: 16px; }
.icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 32px; height: 32px; padding: 0 9px; font-size: 13px; }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn.confirm { color: var(--danger); border-color: var(--danger); }
.frame { border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(25,31,40,.06); }
.frame.off { opacity: .35; }
.ed .stage [data-k] { cursor: text; border-radius: 3px; transition: box-shadow .15s; }
.ed .stage [data-k]:hover { box-shadow: 0 0 0 1px rgba(255,64,124,.45); }
.ed .stage [data-k]:focus { outline: none; box-shadow: 0 0 0 2px var(--brand); background: rgba(255,235,241,.6); }
.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--sub-strong); }
.field textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 9px 11px; font-size: 14px; resize: vertical; min-height: 64px; line-height: 1.55; }
details.adv { border: 1px solid var(--line); border-radius: 10px; }
details.adv > summary { cursor: pointer; padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--sub-strong); }
details.adv > div { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.slot { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot-name { font-size: 12px; font-weight: 700; }
.slot-img { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; background: var(--card); display: grid; place-items: center; overflow: hidden; color: var(--sub); font-size: 12px; }
.slot-img img { width: 100%; height: 100%; object-fit: contain; }
.slot input[type="file"] { display: none; }
.slot-url { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
.slot:focus { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (max-width: 700px) { .below { grid-template-columns: 1fr; } }

/* ───────── 슬라이드 공통 ───────── */
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.sl { position: absolute; inset: 0; padding: 4.3cqw 5.4cqw 5cqw; display: flex; flex-direction: column; }
.sl p, .sl h1, .sl h2, .sl h3, .sl h4, .sl ul, .sl ol, .sl dl, .sl dd, .sl figure { margin: 0; }
.sl ul, .sl ol { padding: 0; list-style: none; }
.hd { display: flex; flex-direction: column; gap: .6cqw; padding-bottom: 1.5cqw; border-bottom: 1px solid var(--line); }
.sec { font-size: 1.02cqw; font-weight: 700; color: var(--brand); letter-spacing: .03em; view-transition-name: slh-sec; }
.t { font-family: var(--f-display); font-weight: 700; font-size: 2.6cqw; line-height: 1.3; letter-spacing: -.015em; text-wrap: balance; view-transition-name: slh-title; }
.lead { font-size: 1.3cqw; font-weight: 500; color: var(--sub-strong); line-height: 1.5; }
.bd { flex: 1; min-height: 0; margin-top: 2cqw; display: flex; flex-direction: column; gap: 1.6cqw; }
.ft { position: absolute; left: 5.4cqw; right: 5.4cqw; bottom: 2cqw; display: flex; justify-content: space-between; align-items: center; gap: 2cqw; font-size: .85cqw; color: var(--sub); }
.ft .pg { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--sub-strong); }
.chip { display: inline-flex; align-items: center; font-size: .92cqw; font-weight: 700; border-radius: 99px; padding: .28cqw .85cqw; white-space: nowrap; line-height: 1.3; }
.chip.c-go { background: var(--brand); color: #fff; }
.chip.c-plan { background: var(--card); color: var(--sub-strong); }
.chip.c-done { background: var(--ink); color: #fff; }
.chip.c-soft { background: var(--brand-soft); color: var(--brand); }
.lbl-sm { font-size: .95cqw; font-weight: 700; color: var(--sub); letter-spacing: .04em; }
.num { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.fx { transition: opacity .35s ease, box-shadow .35s ease, transform .35s ease, filter .35s ease; }
.sl.fmode .fx:not(.on) { opacity: .2; filter: grayscale(.6); }
.sl.fmode .fx.on { box-shadow: 0 0 0 .2cqw var(--brand); }
.pv .fx { cursor: pointer; }
.dots { display: flex; flex-direction: column; gap: .7cqw; }
.dots li { position: relative; padding-left: 1.3cqw; font-size: 1.28cqw; line-height: 1.55; color: var(--sub-strong); }
.dots li::before { content: ""; position: absolute; left: 0; top: .72cqw; width: .45cqw; height: .45cqw; border-radius: 50%; background: var(--sub); }
.empty { display: inline-block; min-width: 4em; min-height: 1em; background: var(--card); border-radius: 3px; }

/* 표지 */
.sl-cover { padding: 6cqw 6.4cqw 5cqw; justify-content: space-between; }
.cv-top { display: flex; align-items: center; gap: 1.2cqw; }
.cv-top i { width: 3.2cqw; height: .42cqw; background: var(--brand); border-radius: 1cqw; }
.cv-k { font-size: 1.25cqw; font-weight: 700; color: var(--sub-strong); }
.cv-main { display: flex; flex-direction: column; gap: 1.6cqw; }
.cv-t { font-family: var(--f-display); font-weight: 800; font-size: 4.6cqw; line-height: 1.2; letter-spacing: -.03em; text-wrap: balance; max-width: 72%; view-transition-name: slh-title; }
.cv-s { font-size: 1.65cqw; font-weight: 600; color: var(--brand); }
.cv-meta { display: flex; gap: 5cqw; padding-top: 1.8cqw; border-top: 1px solid var(--line); }
.cv-meta div { display: flex; flex-direction: column; gap: .3cqw; }
.cv-meta dt { font-size: .95cqw; color: var(--sub); font-weight: 600; }
.cv-meta dd { font-size: 1.3cqw; font-weight: 700; }

/* 목차 */
.ag { display: grid; grid-template-columns: 30% 1fr; gap: 5cqw; height: 100%; padding: 5.6cqw 6.4cqw; }
.ag-l { display: flex; flex-direction: column; gap: .8cqw; }
.ag-l .t { font-size: 3.4cqw; }
.ag-l .lbl-sm { color: var(--brand); }
.ag-list { border-top: 2px solid var(--ink); align-self: start; }
.ag-list li { display: grid; grid-template-columns: 5cqw 1fr auto; gap: 1.4cqw; align-items: baseline; padding: 1.45cqw 0; border-bottom: 1px solid var(--line); }
.ag-list .n { font-family: var(--f-display); font-weight: 800; font-size: 1.55cqw; color: var(--brand); }
.ag-list .a { font-family: var(--f-display); font-weight: 700; font-size: 1.85cqw; }
.ag-list .d { font-size: 1.2cqw; color: var(--sub); }

/* 요약 */
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4cqw; flex: 1; min-height: 0; }
.sum-c { border-radius: 1.2cqw; background: var(--card); padding: 2cqw; display: flex; flex-direction: column; gap: 1.2cqw; min-width: 0; }
.sum-c:nth-child(2) { background: var(--ink); color: #fff; }
.sum-c:nth-child(2) .dots li { color: rgba(255,255,255,.86); }
.sum-c:nth-child(2) .dots li::before { background: var(--brand); }
.sum-h { display: flex; align-items: baseline; gap: .8cqw; }
.sum-h .num { font-size: 1.3cqw; color: var(--brand); }
.sum-h h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.75cqw; }
.sum-big { font-family: var(--f-display); font-weight: 700; font-size: 1.95cqw; line-height: 1.38; }
.sum-c .dots li { font-size: 1.32cqw; }

/* KPI */
.kpi { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 1.2cqw; flex: 1; min-height: 0; }
.kp { border-radius: 1.2cqw; background: var(--card); padding: 2.2cqw 1.9cqw; display: flex; flex-direction: column; gap: .8cqw; min-width: 0; }
.kp .nt { margin-top: auto; }
.kp.hi { background: var(--brand); color: #fff; }
.kp .lb { font-size: 1.25cqw; font-weight: 700; color: var(--sub-strong); }
.kp.hi .lb, .kp.hi .nt { color: rgba(255,255,255,.9); }
.kp .vv { display: flex; align-items: baseline; gap: .3cqw; }
.kp .num { font-size: 3.9cqw; line-height: 1.1; }
.kp .un { font-size: 1.25cqw; font-weight: 700; }
.kp .nt { font-size: 1.12cqw; color: var(--sub); }
.ctxbar { display: flex; flex-wrap: wrap; align-items: center; gap: .6cqw 2.4cqw; border-top: 1px solid var(--line); padding-top: 1.2cqw; font-size: 1.15cqw; color: var(--sub-strong); }
.ctxbar b { font-weight: 700; color: var(--ink); }
.insight { display: flex; gap: 1.2cqw; align-items: flex-start; background: var(--brand-soft); border-radius: 1cqw; padding: 1.3cqw 1.6cqw; }
.insight .lbl-sm { color: var(--brand); flex: none; padding-top: .15cqw; }
.insight p { font-size: 1.3cqw; font-weight: 600; line-height: 1.55; }

/* 차트 */
.chart-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 19cqw; gap: 2.2cqw; flex: 1; min-height: 0; }
.chart { position: relative; min-width: 0; display: flex; flex-direction: column; gap: .6cqw; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.ax { font-family: var(--f-body); font-size: 15px; fill: var(--sub); font-variant-numeric: tabular-nums; }
.ax.strong { fill: var(--sub-strong); font-weight: 700; }
.gl { stroke: var(--line); stroke-width: 1; }
.bar { fill: var(--brand); cursor: pointer; transition: opacity .2s; }
.bar-hit { fill: transparent; cursor: pointer; }
.chart.sel .bar:not(.cur) { opacity: .35; }
.gap-box { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 5 5; }
.vlab { font-family: var(--f-display); font-weight: 700; font-size: 16px; fill: var(--ink); }
.ln { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.pt { fill: var(--brand); stroke: var(--bg); stroke-width: 3; cursor: pointer; }
.pt.cur { fill: var(--ink); }
.ref-avg { stroke: var(--sub); stroke-width: 1.5; stroke-dasharray: 6 6; }
.ref-tgt { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 6; }
.tgt-band { fill: var(--brand-soft); }
.side { display: flex; flex-direction: column; gap: 1.2cqw; min-width: 0; }
.info { border-radius: 1.1cqw; background: var(--card); padding: 1.5cqw 1.6cqw; display: flex; flex-direction: column; gap: .8cqw; }
.info .lbl-sm { color: var(--sub); }
.info h4 { font-family: var(--f-display); font-weight: 800; font-size: 1.7cqw; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: .6cqw 1cqw; font-size: 1.2cqw; }
.info dt { color: var(--sub-strong); }
.info dd { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.info dd small { font-weight: 600; color: var(--brand); margin-left: .4cqw; font-size: .95cqw; }
.legend { display: flex; flex-wrap: wrap; gap: .4cqw 1.6cqw; font-size: .98cqw; color: var(--sub-strong); }
.legend span { display: inline-flex; align-items: center; gap: .5cqw; }
.legend i { width: 1.6cqw; height: 0; border-top: 2px dashed var(--sub); }
.legend i.tg { border-color: var(--ink); }
.legend i.ln-k { border-top: 3px solid var(--brand); }
.legend i.sq { width: .9cqw; height: .9cqw; border: 0; border-radius: .2cqw; background: var(--brand); }
.hint { font-size: .9cqw; color: var(--sub); }

/* 운영 병목 */
.flow { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 1.8cqw; position: relative; }
.fs { position: relative; display: flex; flex-direction: column; gap: .8cqw; min-width: 0; }
.fs-box { border-radius: 1cqw; border: 1.5px solid var(--line-strong); padding: 1.4cqw 1.3cqw; min-height: 11cqw; display: flex; flex-direction: column; gap: .5cqw; background: var(--bg); }
.fs.man .fs-box { border-color: var(--brand); background: var(--brand-soft); }
.fs-box h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.6cqw; }
.fs-box p { font-size: 1.15cqw; color: var(--sub-strong); line-height: 1.5; }
.fs:not(:last-child)::after { content: ""; position: absolute; right: -1.45cqw; top: 3.6cqw; width: 1.1cqw; height: 1.1cqw; border-top: 2px solid var(--line-strong); border-right: 2px solid var(--line-strong); transform: rotate(45deg); }
.fs .fix { font-size: 1.12cqw; font-weight: 600; color: var(--sub-strong); display: flex; gap: .5cqw; }
.fs .fix::before { content: "→"; color: var(--brand); font-weight: 800; }
.bn-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2cqw; }
.bs { border-radius: 1cqw; background: var(--card); padding: 1.8cqw 1.9cqw; display: flex; flex-direction: column; gap: .3cqw; }
.bs .num { font-size: 3cqw; }
.bs .lb { font-size: 1.15cqw; color: var(--sub-strong); font-weight: 600; }
.bs.hi { background: var(--ink); color: #fff; }
.bs.hi .lb { color: rgba(255,255,255,.8); }

/* 목표 */
.vision { display: flex; align-items: center; gap: 2cqw; border-radius: 1.2cqw; background: var(--ink); color: #fff; padding: 1.6cqw 2.2cqw; }
.vision .lbl-sm { color: var(--brand); }
.vision h3 { font-family: var(--f-display); font-weight: 800; font-size: 2.3cqw; letter-spacing: -.02em; }
.vision p { margin-left: auto; font-size: 1.05cqw; color: rgba(255,255,255,.7); }
.vision .hl { color: var(--brand); }
.goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4cqw; flex: 1; min-height: 0; }
.gc { border-radius: 1.2cqw; border: 1.5px solid var(--line); padding: 1.8cqw 2cqw; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr auto; gap: .8cqw 1.6cqw; min-width: 0; }
.gc .no { font-size: 1.02cqw; font-weight: 800; color: var(--brand); grid-column: 1; }
.gc h3 { font-family: var(--f-display); font-weight: 800; font-size: 2.1cqw; line-height: 1.25; grid-column: 1; }
.gc .ds { font-size: 1.3cqw; color: var(--sub-strong); line-height: 1.55; grid-column: 1; }
.gc .kp-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .6cqw 1.6cqw; align-items: center; border-top: 1px solid var(--line); padding-top: 1cqw; font-size: 1.3cqw; font-weight: 600; }
.gc .kp-row b { color: var(--brand); font-weight: 800; }
.concept { grid-column: 2; grid-row: 1 / 4; width: 16cqw; display: flex; flex-direction: column; gap: .4cqw; }
.concept svg { width: 100%; height: auto; display: block; }
.concept .hint { text-align: right; }

/* R&R */
.rnr { display: grid; grid-template-columns: 19cqw minmax(0, 1fr); gap: 2.4cqw; flex: 1; min-height: 0; }
.role-card { border-radius: 1.2cqw; background: var(--ink); color: #fff; padding: 2cqw; display: flex; flex-direction: column; gap: 1cqw; }
.role-card .lbl-sm { color: var(--brand); }
.role-card h3 { font-family: var(--f-display); font-weight: 800; font-size: 2.2cqw; }
.role-card p { font-size: 1.22cqw; color: rgba(255,255,255,.8); line-height: 1.55; }
.role-card ul { margin-top: auto; display: flex; flex-direction: column; gap: .55cqw; border-top: 1px solid rgba(255,255,255,.16); padding-top: 1.2cqw; }
.role-card li { font-size: 1.15cqw; color: rgba(255,255,255,.85); display: flex; justify-content: space-between; gap: 1cqw; }
.role-card li b { color: #fff; font-weight: 700; }
.tbl { width: 100%; border-collapse: collapse; font-size: 1.3cqw; }
.tbl th { text-align: left; font-size: 1.05cqw; font-weight: 700; color: var(--sub); padding: 0 1cqw .8cqw 0; border-bottom: 2px solid var(--ink); }
.tbl td { padding: 1.15cqw 1.2cqw 1.15cqw 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--sub-strong); line-height: 1.5; }
.tbl td:first-child { font-family: var(--f-display); font-weight: 700; color: var(--ink); white-space: nowrap; }
.tbl td.k { color: var(--brand); font-weight: 700; }
.tbl tr.fx.on td { background: var(--brand-soft); }
.sl.fmode .tbl tr.fx.on { box-shadow: none; }

/* 실적 */
.done { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 2.4cqw; flex: 1; min-height: 0; }
.done.noimg { grid-template-columns: 1fr; }
.pts { display: grid; gap: 1cqw; align-content: start; }
.done.noimg .pts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pt-c { border-radius: 1cqw; background: var(--card); padding: 1.5cqw 1.6cqw; display: flex; flex-direction: column; gap: .5cqw; }
.done.noimg .pt-c { min-height: 22cqw; padding: 2.2cqw 2cqw; gap: 1cqw; }
.pt-c .num { font-size: 1.4cqw; color: var(--brand); }
.pt-c h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.75cqw; }
.pt-c p { font-size: 1.3cqw; color: var(--sub-strong); line-height: 1.55; }
.shots { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 1.2cqw; min-height: 0; }
.shot { position: relative; background: var(--card); border-radius: 1.2cqw; overflow: hidden; min-height: 0; display: grid; place-items: center; }
.shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.shot .cap { position: absolute; left: 1cqw; top: 1cqw; font-size: .95cqw; font-weight: 700; border-radius: 99px; padding: .3cqw .9cqw; background: var(--ink); color: #fff; }
.shot.after .cap { background: var(--brand); }

/* 간트 */
.gantt { position: relative; display: flex; flex-direction: column; }
.g-row { display: grid; grid-template-columns: 24cqw minmax(0, 1fr); align-items: center; min-height: 2.42cqw; border-bottom: 1px solid var(--line); position: relative; }
.g-head { border-bottom: 2px solid var(--ink); min-height: 2.5cqw; }
.g-lab { display: flex; align-items: center; gap: .8cqw; padding-right: 1.2cqw; min-width: 0; }
.g-lab .ph { flex: none; font-size: .8cqw; font-weight: 800; color: #fff; background: var(--sub-strong); border-radius: .3cqw; padding: .1cqw .4cqw; min-width: 2.4cqw; text-align: center; }
.g-lab .ph.p0 { background: var(--sub); }
.g-lab .ph.p1 { background: var(--brand); }
.g-lab .ph.p2 { background: #C2185B; }
.g-lab .ph.p3 { background: var(--ink); }
.g-lab b { font-family: var(--f-display); font-weight: 700; font-size: 1.18cqw; min-width: 0; }
.g-lab span.pd { margin-left: auto; font-size: .95cqw; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
.g-row.past .g-lab b, .g-row.past .g-lab span.pd { color: var(--sub); }
.g-track { position: relative; height: 100%; min-height: 2.4cqw; }
.g-months { display: grid; grid-template-columns: repeat(var(--m, 12), minmax(0, 1fr)); height: 100%; align-items: end; }
.g-months span { font-size: .95cqw; font-weight: 700; color: var(--sub-strong); padding: 0 0 .5cqw .45cqw; border-left: 1px solid var(--line); white-space: nowrap; }
.g-months span.y { color: var(--brand); }
.g-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--m, 12), minmax(0, 1fr)); pointer-events: none; }
.g-grid i { border-left: 1px solid var(--line); }
.g-bar { position: absolute; top: 50%; height: 1.2cqw; transform: translateY(-50%); border-radius: .35cqw; background: var(--brand-soft); border: 1.5px solid var(--brand); transform-origin: left center; }
.g-bar.go { background: var(--brand); border-color: var(--brand); }
.g-bar.done { background: var(--ink); border-color: var(--ink); }
.g-bar.ongoing { background: transparent; border: 1.5px dashed var(--sub); }
.g-ms { position: absolute; top: 50%; width: 1.35cqw; height: 1.35cqw; background: var(--brand); transform: translate(-50%, -50%) rotate(45deg); border-radius: .15cqw; box-shadow: 0 0 0 .3cqw var(--bg); }
.g-past { position: absolute; top: 2.5cqw; bottom: 0; left: 24cqw; background: repeating-linear-gradient(135deg, rgba(139,149,161,.07) 0 .5cqw, transparent .5cqw 1cqw); pointer-events: none; }
.g-today { position: absolute; top: 2.5cqw; bottom: 0; width: 0; border-left: 2px solid var(--brand); pointer-events: none; z-index: 2; }
.g-today b { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: .82cqw; font-weight: 800; color: #fff; background: var(--brand); border-radius: .3cqw; padding: .05cqw .4cqw; white-space: nowrap; }
.g-legend { display: flex; gap: 2cqw; margin-top: 1cqw; font-size: .98cqw; color: var(--sub-strong); flex-wrap: wrap; align-items: center; }
.g-legend span { display: inline-flex; align-items: center; gap: .5cqw; }
.g-legend i { display: inline-block; width: 1.8cqw; height: .9cqw; border-radius: .25cqw; background: var(--brand-soft); border: 1.5px solid var(--brand); }
.g-legend i.go { background: var(--brand); }
.g-legend i.done { background: var(--ink); border-color: var(--ink); }
.g-legend i.on { background: transparent; border: 1.5px dashed var(--sub); }
.g-legend i.ms { width: .9cqw; height: .9cqw; background: var(--brand); border: 0; transform: rotate(45deg); }
.g-row.fx.on { background: var(--brand-soft); }
.sl.fmode .g-row.fx.on { box-shadow: none; }

/* 로드맵 지도 */
.hub { position: relative; width: 100%; aspect-ratio: 1000 / 370; max-height: 100%; margin: auto 0; }
.hub svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.road { fill: none; stroke: var(--card); stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
.road-mid { fill: none; stroke: #fff; stroke-width: 2.5; stroke-dasharray: 12 14; }
.road-prog { fill: none; stroke: var(--brand); stroke-width: 34; stroke-linecap: round; opacity: .9; stroke-dasharray: 1 1; transition: stroke-dashoffset .9s cubic-bezier(.4,0,.2,1); }
.hub-cap { position: absolute; font-size: .95cqw; font-weight: 800; color: var(--sub); white-space: nowrap; transform: translate(-50%, -50%); }
.stn { position: absolute; transform: translate(-50%, -1.7cqw); display: flex; flex-direction: column; align-items: center; gap: .5cqw; width: 15cqw; text-align: center; cursor: pointer; }
.stn-dot { width: 3.4cqw; height: 3.4cqw; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: .25cqw solid var(--brand); color: var(--brand); font-family: var(--f-display); font-weight: 800; font-size: 1.35cqw; position: relative; transition: transform .3s; }
.stn-lab { display: flex; flex-direction: column; align-items: center; gap: .2cqw; }
.stn-lab b { font-family: var(--f-display); font-weight: 700; font-size: 1.22cqw; line-height: 1.25; }
.stn-lab span { font-size: .92cqw; color: var(--sub); font-weight: 600; font-variant-numeric: tabular-nums; }
.stn.st-done .stn-dot { background: var(--ink); border-color: var(--ink); color: #fff; }
.stn.seen .stn-dot { background: var(--ink); border-color: var(--ink); color: #fff; }
.stn.seen .stn-lab { opacity: .5; }
.stn.next .stn-dot { background: var(--brand); color: #fff; transform: scale(1.22); box-shadow: 0 0 0 .7cqw rgba(255,64,124,.18); }
.stn.next .stn-lab b { color: var(--brand); }
.stn .tag-next { position: absolute; top: -2.1cqw; font-size: .8cqw; font-weight: 800; color: #fff; background: var(--ink); border-radius: .3cqw; padding: .05cqw .45cqw; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,64,124,.35); } 100% { box-shadow: 0 0 0 1.4cqw rgba(255,64,124,0); } }
.pv .stn.next .stn-dot { animation: pulse 1.6s ease-out infinite; }

/* 로드맵 상세 공통 */
.rm-top { display: flex; align-items: center; justify-content: space-between; gap: 2cqw; }
.rm-badge { display: inline-flex; align-items: center; gap: 1cqw; }
.rm-badge .n { width: 2.6cqw; height: 2.6cqw; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 1.15cqw; }
.rm-badge .n.done { background: var(--ink); }
.rm-badge b { font-family: var(--f-display); font-weight: 700; font-size: 1.35cqw; }
.rm-badge .pd { font-size: 1.02cqw; color: var(--sub-strong); font-weight: 600; font-variant-numeric: tabular-nums; }
.rm-mini { display: flex; align-items: center; gap: .45cqw; }
.rm-mini i { width: .75cqw; height: .75cqw; border-radius: 50%; background: var(--line-strong); }
.rm-mini i.seen { background: var(--ink); }
.rm-mini i.cur { background: var(--brand); width: 2cqw; border-radius: 1cqw; }
.t.novt { view-transition-name: none; }
.sec-row { display: flex; flex-wrap: wrap; gap: .6cqw 1.6cqw; align-items: center; font-size: 1.12cqw; }
.sec-row .lbl-sm { color: var(--brand); }
.sec-row span.it { display: inline-flex; gap: .5cqw; align-items: baseline; font-weight: 600; }
.sec-row span.it::before { content: ""; width: .45cqw; height: .45cqw; border-radius: 50%; background: var(--ink); align-self: center; }
.who { display: inline-flex; align-items: center; font-size: .82cqw; font-weight: 800; border-radius: .3cqw; padding: .1cqw .5cqw; white-space: nowrap; }
.who.w-p { background: var(--brand); color: #fff; }
.who.w-o { background: var(--ink); color: #fff; }
.who.w-s { background: var(--card); color: var(--sub-strong); }
.who.w-m { background: var(--line-strong); color: var(--ink); }

/* 자재 구매: 여정 */
.jr { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 1cqw; position: relative; }
.jr::before { content: ""; position: absolute; left: 3%; right: 3%; top: 1.9cqw; height: 2px; background: var(--line-strong); }
.js { position: relative; display: flex; flex-direction: column; gap: .55cqw; min-width: 0; }
.js .ic { width: 3.8cqw; height: 3.8cqw; border-radius: 50%; background: var(--bg); border: .22cqw solid var(--ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.3cqw; position: relative; z-index: 1; }
.js.auto .ic { border-color: var(--brand); color: var(--brand); }
.js h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.4cqw; }
.js p { font-size: 1.05cqw; color: var(--sub-strong); line-height: 1.5; }
.scr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1cqw; }
.sc { border-radius: 1cqw; background: var(--card); padding: 1.3cqw 1.5cqw; display: flex; flex-direction: column; gap: .4cqw; }
.sc .lbl-sm { color: var(--brand); }
.sc h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.45cqw; }
.sc p { font-size: 1.08cqw; color: var(--sub-strong); line-height: 1.5; }

/* 작업자 모집: 페이지 목업 */
.pm-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3cqw; flex: 1; min-height: 0; }
.pm { border-radius: 1.2cqw; border: 1.5px solid var(--line-strong); overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
.pm-bar { display: flex; gap: .4cqw; padding: .7cqw 1cqw; background: var(--card); align-items: center; }
.pm-bar i { width: .65cqw; height: .65cqw; border-radius: 50%; background: var(--line-strong); }
.pm-bar span { margin-left: .8cqw; font-size: .85cqw; color: var(--sub); }
.pm-sec { display: grid; grid-template-columns: 2.2cqw 1fr; gap: .4cqw 1cqw; padding: 1cqw 1.4cqw; border-top: 1px solid var(--line); align-items: baseline; }
.pm-sec .n { font-family: var(--f-display); font-weight: 800; font-size: 1.05cqw; color: var(--brand); }
.pm-sec h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.3cqw; }
.pm-sec p { grid-column: 2; font-size: 1.02cqw; color: var(--sub-strong); line-height: 1.45; }
.pm-sec.cta { background: var(--ink); color: #fff; }
.pm-sec.cta p { color: rgba(255,255,255,.8); }
.side-list { display: flex; flex-direction: column; gap: 1.4cqw; }
.side-list h4 { font-size: 1.05cqw; font-weight: 800; color: var(--sub); letter-spacing: .04em; margin-bottom: .6cqw; }
.side-list .dots li { font-size: 1.32cqw; color: var(--ink); }
.side-box { border-radius: 1cqw; background: var(--card); padding: 1.5cqw 1.7cqw; }
.side-box.hi { background: var(--brand-soft); }
.side-box.hi h4 { color: var(--brand); }

/* 커뮤니티 MVP: 파이프라인 */
.pipe { display: flex; align-items: stretch; gap: .6cqw; }
.pp { flex: 1 1 0; min-width: 0; border-radius: 1cqw; border: 1.5px solid var(--line-strong); padding: 1.2cqw 1.1cqw; display: flex; flex-direction: column; gap: .5cqw; background: var(--bg); }
.pp.auto { border-color: var(--brand); }
.pp.human { background: var(--ink); color: #fff; border-color: var(--ink); }
.pp.human p { color: rgba(255,255,255,.75); }
.pp h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.3cqw; line-height: 1.3; }
.pp p { font-size: .98cqw; color: var(--sub-strong); line-height: 1.45; }
.pp .chip { align-self: flex-start; font-size: .8cqw; }
.pipe .ar { flex: none; align-self: center; color: var(--brand); font-weight: 800; font-size: 1.4cqw; }
.mvp-bottom { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 2cqw; flex: 1; min-height: 0; }
.art { border-radius: 1.2cqw; background: var(--card); padding: 1.6cqw 1.8cqw; display: flex; flex-direction: column; gap: .7cqw; }
.art .lbl-sm { color: var(--brand); }
.art h4 { font-family: var(--f-display); font-weight: 800; font-size: 1.7cqw; line-height: 1.3; }
.art .meta { font-size: .95cqw; color: var(--sub); }
.art p { font-size: 1.12cqw; color: var(--sub-strong); line-height: 1.6; }

/* 플래너 개편: 비교 */
.cmp { display: grid; grid-template-columns: minmax(0, .8fr) 2.4cqw minmax(0, 1.4fr); flex: 1; min-height: 0; }
.cmp-l { border-radius: 1.2cqw; background: var(--card); padding: 1.7cqw 1.8cqw; display: flex; flex-direction: column; gap: 1cqw; }
.cmp-l h4, .cmp-r h4 { font-size: 1.05cqw; font-weight: 800; color: var(--sub); letter-spacing: .04em; }
.cmp-r { border-radius: 1.2cqw; border: 2px solid var(--ink); padding: 1.7cqw 1.8cqw; display: flex; flex-direction: column; gap: 1.3cqw; }
.cmp-r h4 { color: var(--ink); }
.stepper { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: .5cqw; }
.stp { display: flex; flex-direction: column; gap: .5cqw; }
.stp .sbar { display: block; height: .5cqw; border-radius: 1cqw; background: var(--brand); }
.stp span { font-size: .9cqw; font-weight: 800; color: var(--brand); }
.stp b { font-family: var(--f-display); font-weight: 700; font-size: 1.2cqw; line-height: 1.3; }
.tgts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 1cqw; margin-top: auto; }
.tg-c { border-radius: 1cqw; background: var(--brand-soft); padding: 1.2cqw 1.3cqw; display: flex; flex-direction: column; gap: .35cqw; }
.tg-c .lb { font-size: 1cqw; font-weight: 700; color: var(--sub-strong); }
.tg-c .vv { display: flex; align-items: baseline; gap: .6cqw; flex-wrap: wrap; }
.tg-c .from { font-size: 1.15cqw; color: var(--sub); font-weight: 700; text-decoration: line-through; text-decoration-thickness: 1px; }
.tg-c .to { font-family: var(--f-display); font-weight: 800; font-size: 2.1cqw; color: var(--brand); }
.tg-c.new .to { font-size: 1.4cqw; color: var(--ink); }

/* 공사 설계 자동화: AI */
.ai { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 3cqw; flex: 1; min-height: 0; }
.vflow { display: flex; flex-direction: column; gap: .8cqw; }
.vf { display: grid; grid-template-columns: 3.4cqw 1fr; gap: .3cqw 1.2cqw; align-items: center; border-radius: 1cqw; padding: 1.1cqw 1.3cqw; background: var(--card); }
.vf .ic { grid-row: 1 / 3; width: 3.4cqw; height: 3.4cqw; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.2cqw; }
.vf.auto { background: var(--brand-soft); }
.vf.auto h4 { color: var(--brand); }
.vf .idea { justify-self: start; font-size: .78cqw; font-weight: 800; color: #fff; background: var(--sub-strong); border-radius: .3cqw; padding: .05cqw .45cqw; }
.vf.auto .ic { background: var(--brand); }
.vf h4 { font-family: var(--f-display); font-weight: 700; font-size: 1.4cqw; }
.vf p { font-size: 1.05cqw; color: var(--sub-strong); line-height: 1.45; }
.vflow .dn { align-self: center; color: var(--sub); font-weight: 800; font-size: 1.1cqw; margin: -.3cqw 0; }
.phone { border-radius: 1.6cqw; border: 1.5px solid var(--line-strong); background: var(--card); padding: 1.4cqw; display: flex; flex-direction: column; gap: .9cqw; }
.phone .ph-h { font-size: .95cqw; font-weight: 800; color: var(--sub-strong); display: flex; justify-content: space-between; }
.bub { max-width: 82%; border-radius: 1.1cqw; padding: .9cqw 1.2cqw; font-size: 1.12cqw; line-height: 1.5; background: var(--bg); align-self: flex-start; }
.bub.me { align-self: flex-end; background: var(--ink); color: #fff; }
.bub.ai { border: 1.5px solid var(--brand); }
.bub.sys { align-self: center; background: transparent; color: var(--sub); font-size: .95cqw; padding: .2cqw; text-align: center; }
.bub .who-l { display: block; font-size: .82cqw; font-weight: 800; color: var(--brand); margin-bottom: .2cqw; }
.bub.flag { border: 1.5px solid var(--brand); background: var(--bg); }
.bub .fl { display: inline-block; margin-top: .5cqw; font-size: .82cqw; font-weight: 800; color: #fff; background: var(--brand); border-radius: .3cqw; padding: .1cqw .5cqw; }
.req { border-radius: 1cqw; background: var(--bg); border: 1.5px dashed var(--brand); padding: 1cqw 1.2cqw; display: grid; grid-template-columns: auto 1fr; gap: .35cqw 1.2cqw; font-size: 1.05cqw; }
.req .lbl-sm { grid-column: 1 / -1; color: var(--brand); }
.req dt { color: var(--sub); font-weight: 600; }
.req dd { font-weight: 700; margin: 0; }

/* 작업자 화면: 대시보드 */
.dsh-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2.6cqw; flex: 1; min-height: 0; }
.dsh { border-radius: 1.2cqw; border: 1.5px solid var(--line-strong); padding: 1.4cqw; display: flex; flex-direction: column; gap: 1cqw; }
.dsh-h { display: flex; justify-content: space-between; align-items: center; }
.dsh-h b { font-family: var(--f-display); font-weight: 700; font-size: 1.3cqw; }
.dsh-h span { font-size: .9cqw; color: var(--sub); }
.dsh-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9cqw; flex: 1; }
.dt { border-radius: .9cqw; background: var(--card); padding: 1.1cqw 1.2cqw; display: flex; flex-direction: column; gap: .3cqw; }
.dt .lb { font-size: .98cqw; color: var(--sub-strong); font-weight: 700; }
.dt .v { font-family: var(--f-display); font-weight: 800; font-size: 1.6cqw; }
.dt p { font-size: .92cqw; color: var(--sub); }
.sub-ba { display: flex; flex-direction: column; gap: 1cqw; }
.sb { border-radius: 1.1cqw; padding: 1.4cqw 1.6cqw; display: flex; flex-direction: column; gap: .7cqw; background: var(--card); }
.sb.after { background: var(--ink); color: #fff; }
.sb.after .dots li { color: rgba(255,255,255,.88); }
.sb.after .dots li::before { background: var(--brand); }
.sb h4 { font-size: 1.05cqw; font-weight: 800; letter-spacing: .03em; color: var(--sub); }
.sb.after h4 { color: var(--brand); }
.sb h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.6cqw; }
.sub-ba .dn { align-self: center; color: var(--brand); font-weight: 800; }

/* 인앱 채팅 */
.ch-wrap { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.2fr) minmax(0, .9fr); gap: 2cqw; flex: 1; min-height: 0; }
.ch-before { border-radius: 1.2cqw; background: var(--card); padding: 1.7cqw; display: flex; flex-direction: column; gap: .8cqw; }
.ch-before h4 { font-size: 1.05cqw; font-weight: 800; color: var(--sub); letter-spacing: .04em; }
.ch-before .num { font-size: 3.6cqw; line-height: 1; }
.ch-before .num small { font-size: 1.3cqw; margin-left: .3cqw; }
.ch-before .lb { font-size: 1.1cqw; color: var(--sub-strong); font-weight: 600; }

/* 커뮤니티 포커스 */
.cm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1.1cqw; flex: 1; min-height: 0; }
.cmb { border-radius: 1.2cqw; background: var(--card); padding: 1.6cqw 1.8cqw; display: flex; flex-direction: column; gap: .6cqw; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.cmb .no { font-family: var(--f-display); font-weight: 800; font-size: 1.15cqw; color: var(--brand); }
.cmb h4 { font-family: var(--f-display); font-weight: 800; font-size: 2.1cqw; line-height: 1.25; }
.cmb .cm-d, .cmb .cm-pts { display: none; }
.cmb .who { align-self: flex-start; }
.cmb.seen::after { content: "✓"; position: absolute; right: 1.4cqw; top: 1.2cqw; font-weight: 800; color: var(--sub); font-size: 1.2cqw; }
.cmb.seen h4 { color: var(--sub-strong); }
.cm.edit .cmb .cm-d, .cm.edit .cmb .cm-pts { display: block; }
.cm.edit .cmb h4 { font-size: 1.6cqw; }
.cm.edit .cmb .cm-d { font-size: 1.05cqw; color: var(--sub-strong); }
.cm.focus { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: .8cqw 1.4cqw; }
.cm.focus .cmb { padding: .8cqw 1.3cqw; flex-direction: row; align-items: center; gap: 1cqw; background: transparent; border: 1.5px solid var(--line); }
.cm.focus .cmb h4 { font-size: 1.25cqw; color: var(--sub); }
.cm.focus .cmb .no { color: var(--sub); }
.cm.focus .cmb .who { display: none; }
.cm.focus .cmb.seen::after { top: 50%; transform: translateY(-50%); }
.cm.focus .cmb.cur { grid-column: 1; grid-row: 1 / -1; flex-direction: column; align-items: stretch; padding: 2.4cqw 2.6cqw; background: var(--ink); color: #fff; border: 0; gap: 1.2cqw; }
.cm.focus .cmb.cur h4 { font-size: 3.2cqw; color: #fff; }
.cm.focus .cmb.cur .no { color: var(--brand); font-size: 1.4cqw; }
.cm.focus .cmb.cur .who { display: inline-flex; background: var(--brand); color: #fff; font-size: 1cqw; }
.cm.focus .cmb.cur .cm-d { display: block; font-size: 1.5cqw; line-height: 1.55; color: rgba(255,255,255,.9); }
.cm.focus .cmb.cur .cm-pts { display: flex; flex-direction: column; gap: .8cqw; margin-top: auto; }
.cm.focus .cmb.cur .cm-pts li { font-size: 1.3cqw; color: rgba(255,255,255,.82); padding-left: 1.4cqw; position: relative; }
.cm.focus .cmb.cur .cm-pts li::before { content: ""; position: absolute; left: 0; top: .75cqw; width: .5cqw; height: .5cqw; border-radius: 50%; background: var(--brand); }
.cm.focus .cmb.cur::after { display: none; }
@keyframes cmIn { from { opacity: 0; transform: translateY(1cqw); } to { opacity: 1; transform: none; } }
.pv .cm.focus .cmb.cur .cm-d, .pv .cm.focus .cmb.cur .cm-pts li { animation: cmIn .6s cubic-bezier(.2,.7,.2,1) both; }
.pv .cm.focus .cmb.cur .cm-d { animation-delay: .45s; }
.pv .cm.focus .cmb.cur .cm-pts li:nth-child(1) { animation-delay: .75s; }
.pv .cm.focus .cmb.cur .cm-pts li:nth-child(2) { animation-delay: 1.05s; }
.pv .cm.focus .cmb.cur .cm-pts li:nth-child(3) { animation-delay: 1.35s; }
.pv .cm.focus .cmb.cur .cm-pts li:nth-child(4) { animation-delay: 1.65s; }

/* 성장 시나리오 */
.gw { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0 .9cqw; flex: 1; min-height: 0; grid-template-rows: auto minmax(0, 1fr); }
.lv { border-radius: 1cqw; background: var(--card); padding: 1.1cqw 1.1cqw; display: flex; flex-direction: column; gap: .45cqw; min-width: 0; }
.lv .lb { font-size: 1.02cqw; font-weight: 800; color: var(--ink); }
.lv .ch { font-size: 1.02cqw; font-weight: 700; color: var(--sub-strong); font-variant-numeric: tabular-nums; }
.lv .mx { font-family: var(--f-display); font-weight: 800; font-size: 1.9cqw; color: var(--brand); line-height: 1.1; }
.lv .why { font-size: .9cqw; color: var(--sub-strong); line-height: 1.45; }
.lv .whos { display: flex; flex-wrap: wrap; gap: .3cqw; margin-top: auto; }
.lv.ex { background: var(--bg); border: 1.5px dashed var(--line-strong); }
.lv.ex .mx { color: var(--sub-strong); }
.lv-end { border-radius: 1cqw; padding: 1.1cqw; display: flex; flex-direction: column; justify-content: flex-end; gap: .3cqw; }
.lv-end .lb { font-size: 1.02cqw; font-weight: 800; color: var(--sub-strong); }
.lv-end p { font-size: .9cqw; color: var(--sub); line-height: 1.45; }
.gw-chart { grid-column: 1 / -1; position: relative; min-height: 0; padding-top: 1.2cqw; }
.gw-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.wf-base { fill: var(--sub-strong); }
.wf-up { fill: var(--brand); }
.wf-up.ex { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.5; stroke-dasharray: 5 4; }
.wf-res { fill: var(--ink); }
.wf-conn { stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 4 4; }
.wf-lab { font-family: var(--f-display); font-weight: 800; font-size: 20px; fill: var(--ink); }
.wf-lab.big { font-size: 30px; fill: var(--brand); }
.wf-ax { font-size: 15px; fill: var(--sub); font-weight: 700; }
.pv .play .wf-up, .pv .play .wf-res, .pv .play .wf-base { transform-box: fill-box; transform-origin: bottom; animation: barUp .7s cubic-bezier(.2,.7,.2,1) both; }
.gw-legend { display: flex; flex-wrap: wrap; gap: .5cqw 1.6cqw; font-size: .98cqw; color: var(--sub-strong); align-items: center; }
.gw-legend span { display: inline-flex; gap: .5cqw; align-items: center; }

.tk-arrow { display: grid; place-items: center; }
.tk-arrow i { width: 1cqw; height: 1cqw; border-top: 2px solid var(--line-strong); border-right: 2px solid var(--line-strong); transform: rotate(45deg); }
.loop { display: flex; flex-wrap: wrap; align-items: center; gap: .6cqw; }
.loop span { font-size: 1.15cqw; font-weight: 700; padding: .5cqw 1.1cqw; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
.loop i { font-style: normal; color: var(--sub); font-weight: 700; }
.loop .lbl-sm { color: var(--sub-strong); margin-right: .6cqw; }

/* 마무리 */
.sl-close { justify-content: center; align-items: flex-start; padding-left: 6.4cqw; gap: 1.4cqw; }
.cl-t { font-family: var(--f-display); font-weight: 800; font-size: 5.6cqw; letter-spacing: -.03em; view-transition-name: slh-title; }
.cl-s { font-size: 1.6cqw; font-weight: 600; color: var(--sub-strong); }
.cl-bar { width: 3.2cqw; height: .42cqw; border-radius: 1cqw; background: var(--brand); }

/* 강조 */
.mk { font-weight: 700; color: inherit; background: linear-gradient(transparent 58%, rgba(255,64,124,.22) 58%); padding: 0 .1em; border-radius: .1em; }
.sum-c:nth-child(2) .mk, .role-card .mk, .vision .mk, .bgc .mk, .sb.after .mk, .ef:first-child .mk, .tn.res .mk { background: linear-gradient(transparent 58%, rgba(255,64,124,.55) 58%); color: #fff; }

/* 기대 효과 카드 */
.eff-head { display: flex; align-items: center; gap: 1cqw; }
.eff-head .lbl-sm { color: var(--brand); }
.effc { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 1cqw; }
.effc.stack { grid-template-columns: 1fr; gap: .7cqw; }
.ef { border-radius: 1cqw; background: var(--brand-soft); padding: 1.2cqw 1.4cqw; display: grid; grid-template-columns: auto 1fr; gap: .2cqw 1cqw; align-items: baseline; min-width: 0; }
.ef:first-child { background: var(--brand); color: #fff; }
.ef .ef-n { grid-row: 1 / 3; font-family: var(--f-display); font-weight: 800; font-size: 1.5cqw; color: var(--brand); }
.ef:first-child .ef-n { color: rgba(255,255,255,.75); }
.ef h4 { font-family: var(--f-display); font-weight: 800; font-size: 1.55cqw; line-height: 1.3; color: var(--brand); }
.ef:first-child h4 { color: #fff; }
.ef p { font-size: 1.05cqw; color: var(--sub-strong); line-height: 1.45; grid-column: 2; }
.ef:first-child p { color: rgba(255,255,255,.9); }
.effc.stack .ef { padding: 1cqw 1.3cqw; }
.effc.stack .ef h4 { font-size: 1.4cqw; }
.kchips { display: flex; flex-wrap: wrap; align-items: center; gap: .5cqw .6cqw; }
.kchips .lbl-sm { color: var(--sub-strong); margin-right: .4cqw; }
.kc { font-size: 1.02cqw; font-weight: 700; border-radius: 99px; padding: .35cqw .95cqw; background: var(--bg); border: 1.5px solid var(--line-strong); color: var(--ink); }
.eff-row { margin-top: .4cqw; }

/* KPI 숫자 줄바꿈 방지 */
.kp .vv { flex-wrap: nowrap; white-space: nowrap; }
.kp .num { font-size: 3.2cqw; }

/* 운영 흐름 (로드맵형) */
.fl-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1cqw; }
.fls { display: flex; align-items: baseline; gap: 1cqw; border-radius: .9cqw; background: var(--card); padding: .9cqw 1.3cqw; min-width: 0; }
.fls .num { font-family: var(--f-display); font-weight: 800; font-size: 2.1cqw; white-space: nowrap; }
.fls .lb { font-size: 1.05cqw; color: var(--sub-strong); font-weight: 600; line-height: 1.35; }
.fls.hi { background: var(--ink); color: #fff; }
.fls.hi .num { color: var(--brand); }
.fls.hi .lb { color: rgba(255,255,255,.85); }
.fl2 { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 1.2cqw; flex: 1; min-height: 0; position: relative; }
.fl2::before { content: ""; position: absolute; left: 2%; right: 2%; top: calc(9.2cqw + .8cqw + 1.6cqw - .45cqw); height: .9cqw; border-radius: 1cqw; background: linear-gradient(90deg, var(--card), var(--line-strong)); }
.fl2::after { content: ""; position: absolute; right: 1%; top: calc(9.2cqw + .8cqw + 1.6cqw - 1cqw); border-left: 1.4cqw solid var(--line-strong); border-top: 1cqw solid transparent; border-bottom: 1cqw solid transparent; }
.f2 { display: grid; grid-template-rows: 9.2cqw 3.2cqw 1fr; gap: .8cqw; min-width: 0; position: relative; justify-items: center; }
.f2-top { display: flex; flex-direction: column; gap: .45cqw; align-items: center; text-align: center; justify-content: flex-end; }
.f2-top h4 { font-family: var(--f-display); font-weight: 800; font-size: 1.6cqw; }
.f2-top p { font-size: 1.02cqw; color: var(--sub-strong); line-height: 1.45; }
.f2-node { width: 3.2cqw; height: 3.2cqw; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: .25cqw solid var(--sub); color: var(--sub-strong); font-family: var(--f-display); font-weight: 800; font-size: 1.25cqw; position: relative; z-index: 1; }
.f2.man .f2-node { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 0 0 .5cqw rgba(255,64,124,.18); }
.f2-sol { position: relative; align-self: stretch; justify-self: stretch; border-radius: 1cqw; background: var(--card); padding: 1.2cqw 1.2cqw; display: flex; flex-direction: column; gap: .45cqw; border-top: .35cqw solid var(--line-strong); }
.f2.man .f2-sol { background: var(--brand-soft); border-top-color: var(--brand); }
.f2-sol::before { content: ""; position: absolute; left: 50%; top: -1.15cqw; height: .8cqw; border-left: 2px dashed var(--line-strong); }
.f2-sol .lbl-sm { color: var(--brand); }
.f2-sol h5 { font-family: var(--f-display); font-weight: 800; font-size: 1.4cqw; line-height: 1.3; }
.f2.man .f2-sol h5 { color: var(--brand); }
.f2-sol p { font-size: 1cqw; color: var(--sub-strong); line-height: 1.45; }
.f2-sol .chip { margin-top: auto; align-self: flex-start; }

/* 디자인 시스템 Before/After */
.ds2 { display: flex; flex-direction: column; align-items: stretch; gap: 3cqw; flex: 1; min-height: 0; justify-content: center; }
.ds2 .ds-g { flex-direction: row; align-items: center; gap: 1.6cqw; }
.ds2 .ds-lab { width: 11cqw; flex: none; font-size: 1.2cqw; line-height: 1.35; }
.ds2 .ds-arrow { display: none; }
.ds-ex { font-size: .95cqw; font-weight: 700; color: var(--sub); }
.ds-wrap { min-width: 0; }
.ds-g { display: flex; flex-direction: column; gap: .8cqw; }
.ds-lab { font-size: 1.1cqw; font-weight: 800; color: var(--sub); }
.ds-g.after .ds-lab { color: var(--brand); }
.ds-row { display: flex; gap: 1cqw; position: relative; }
.ds-img { width: 17cqw; aspect-ratio: 360 / 198; max-width: 100%; border-radius: 1cqw; background: var(--card); overflow: hidden; display: grid; place-items: center; box-shadow: 0 .4cqw 1.2cqw rgba(25,31,40,.08); }
.ds-img img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.ds-img.broken img { display: none; }
.ds-ph { font-size: 1cqw; color: var(--sub); font-weight: 700; }
.ds-g.before .ds-img:nth-child(1) { transform: rotate(-2.5deg); }
.ds-g.before .ds-img:nth-child(2) { transform: rotate(2deg); border: .2cqw solid #D1D6DB; }
.ds-g.before .ds-img:nth-child(3) { transform: rotate(-1.5deg); }
.ds-g.after .ds-img { outline: .2cqw solid var(--brand); outline-offset: .25cqw; }
.ds-guide { position: absolute; left: -1cqw; right: -1cqw; border-top: 2px dashed var(--brand); pointer-events: none; }
.ds-guide.g1 { display: none; }
.ds-guide.g2 { top: 79%; }
.ds-rule { position: absolute; right: 0; bottom: -2.1cqw; white-space: nowrap; font-size: .95cqw; font-weight: 800; color: #fff; background: var(--brand); border-radius: 99px; padding: .25cqw .9cqw; }
.ds-arrow { font-family: var(--f-display); font-weight: 800; font-size: 2.6cqw; color: var(--brand); padding-top: 2cqw; }
.ds-pts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1cqw; margin-top: 1.4cqw; }
.dp { display: flex; flex-direction: column; gap: .2cqw; border-left: .3cqw solid var(--brand); padding: .2cqw 0 .2cqw 1cqw; }
.dp .num { font-size: 1cqw; color: var(--brand); }
.dp b { font-family: var(--f-display); font-weight: 700; font-size: 1.3cqw; }
.dp span:last-child { font-size: 1cqw; color: var(--sub-strong); line-height: 1.45; }

/* 작업자 모집 · 도입 배경 */
.bgc { border-radius: 1.1cqw; background: var(--ink); color: #fff; padding: 1.4cqw 1.6cqw; display: flex; flex-direction: column; gap: .8cqw; }
.bgc .lbl-sm { color: var(--brand); }
.bgc ol { display: flex; flex-direction: column; gap: .7cqw; }
.bgc li { display: flex; gap: .9cqw; align-items: baseline; }
.bgc li span { flex: none; width: 1.7cqw; height: 1.7cqw; border-radius: 50%; background: var(--brand); display: grid; place-items: center; font-size: .9cqw; font-weight: 800; }
.bgc li p { font-size: 1.22cqw; line-height: 1.45; color: rgba(255,255,255,.92); }
.side-list { gap: 1cqw; }

/* 플래너 분기 */
.br-wrap { display: grid; grid-template-columns: minmax(0, .62fr) minmax(0, 2fr); gap: 2cqw; flex: 1; min-height: 0; }
.br-r { display: flex; flex-direction: column; gap: 1cqw; min-width: 0; }
.br-h { color: var(--ink); }
.br { position: relative; display: grid; grid-template-columns: 18% 20% 30% 22%; grid-template-rows: 1fr 1fr; column-gap: 3.333%; row-gap: 10%; height: 17cqw; }
.br-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.br-lines path { fill: none; stroke: var(--line-strong); stroke-width: 3; vector-effect: non-scaling-stroke; }
.br-lines path.hot { stroke: var(--brand); }
.bx { border-radius: 1cqw; padding: 1cqw 1.2cqw; display: flex; flex-direction: column; justify-content: center; gap: .3cqw; position: relative; z-index: 1; background: var(--card); min-width: 0; }
.bx h4 { font-family: var(--f-display); font-weight: 800; font-size: 1.4cqw; line-height: 1.3; }
.bx p { font-size: .98cqw; color: var(--sub-strong); line-height: 1.45; }
.bx-tag { position: absolute; top: -1cqw; left: 1cqw; font-size: .82cqw; font-weight: 800; border-radius: .3cqw; padding: .1cqw .5cqw; background: var(--sub-strong); color: #fff; }
.b-start { grid-column: 1; grid-row: 1 / 3; align-self: center; height: 60%; }
.b-q { grid-column: 2; grid-row: 1 / 3; align-self: center; height: 70%; background: var(--bg); border: 2px solid var(--ink); text-align: center; align-items: center; }
.b-a { grid-column: 3; grid-row: 1; background: var(--bg); border: 1.5px solid var(--line-strong); }
.b-b { grid-column: 3; grid-row: 2; background: var(--ink); color: #fff; }
.b-b p { color: rgba(255,255,255,.85); }
.b-b .bx-tag { background: var(--brand); }
.b-end { grid-column: 4; grid-row: 1 / 3; align-self: center; height: 64%; background: var(--brand-soft); }
.b-end h4 { color: var(--brand); }

/* 공사 설계 폼 목업 */
.fm { border-radius: 1.4cqw; border: 1.5px solid var(--line-strong); background: var(--bg); padding: 1.3cqw 1.5cqw; display: flex; flex-direction: column; gap: .7cqw; min-width: 0; }
.fm-h { display: flex; justify-content: space-between; align-items: baseline; }
.fm-h b { font-family: var(--f-display); font-weight: 800; font-size: 1.25cqw; }
.fm-h span { font-size: 1cqw; font-weight: 800; color: var(--sub-strong); font-variant-numeric: tabular-nums; }
.fm-bar { display: block; height: .35cqw; border-radius: 1cqw; background: linear-gradient(90deg, var(--ink) 8%, var(--card) 8%); }
.fm-sec { font-size: .92cqw; font-weight: 800; color: var(--brand); }

      } else if (act === "unimg") { state.slides[i].d.images[+b.dataset.slot] = null; }
      else if (act === "adv") {
        var ta = card.querySelector('[data-field="adv"]'), st = card.querySelector('[data-role="adv-st"]');
        try { state.slides[i].d = JSON.parse(ta.value); } catch (err) { st.className = "st-text err"; st.textContent = "JSON 형식이 맞지 않아요. 쉼표와 따옴표를 확인하세요."; return; }
        st.className = "st-text"; st.textContent = "적용했어요."; rerenderStage(card); changed(); return;
      } else return;
      changed(); renderCards();
    });

    saveBtn.onclick = save;
    document.getElementById("b-present").onclick = function () { location.hash = "present"; };
    var pd = document.getElementById("p-data"), td = document.getElementById("t-data");
    document.getElementById("b-data").onclick = function () { td.value = state.metrics; pd.hidden = false; pd.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.getElementById("c-data").onclick = function () { pd.hidden = true; };
    td.addEventListener("input", function () {
      state.metrics = td.value; changed();
      listEl.querySelectorAll(".card").forEach(function (cd) { var s = state.slides[idx(cd.dataset.id)]; if (s.type === "chartM" || s.type === "chartR") rerenderStage(cd); });
    });
    var pj = document.getElementById("p-json"), tj = document.getElementById("t-json"), js = document.getElementById("j-st");
    document.getElementById("b-json").onclick = function () { tj.value = JSON.stringify(plain(state), null, 2); js.textContent = ""; pj.hidden = false; document.getElementById("p-link").hidden = false; pj.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.getElementById("j-close").onclick = function () { pj.hidden = true; document.getElementById("p-link").hidden = true; };
    document.getElementById("l-go").onclick = function () { location.hash = "show"; };
    document.getElementById("j-copy").onclick = function () {
      function fb() { tj.focus(); tj.select(); js.className = "st-text"; js.textContent = "전체 선택했어요. 길게 눌러 복사하세요."; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tj.value).then(function () { js.className = "st-text"; js.textContent = "복사했어요."; }, fb); else fb();
    };
    document.getElementById("j-load").onclick = function () {
      var d; try { d = JSON.parse(tj.value); } catch (e) { js.className = "st-text err"; js.textContent = "JSON 형식이 아니에요. 중괄호까지 전부 붙여 넣었는지 확인하세요."; return; }
      if (!d || !Array.isArray(d.slides) || !d.slides.length) { js.className = "st-text err"; js.textContent = "slides 목록을 찾지 못했어요."; return; }
      if (d.slides[0] && d.slides[0].layout && !d.slides[0].type) { js.className = "st-text err"; js.textContent = "예전 시안의 JSON이에요. 이 시안 형식으로 내보낸 JSON을 붙여 넣어 주세요."; return; }
      var rev = state.rev; state = normalize(d); state.rev = rev; changed(); renderCards();
      js.className = "st-text"; js.textContent = "슬라이드 " + state.slides.length + "장을 불러왔어요. 저장을 눌러야 반영돼요.";
    };
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var r = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(function (b) { if (b && b.type === "image/webp") return res(b); c.toBlob(function (b2) { b2 ? res(b2) : rej(new Error("encode")); }, "image/jpeg", .88); }, "image/webp", .86);
      };
      img.onerror = function () { URL.revokeObjectURL(u); rej(new Error("load")); };
      img.src = u;
    });
  }
  function onFile(input, card, i) {
    var f = input.files && input.files[0]; if (!f) return;
    uploadImg(f, card, i, +input.dataset.file); input.value = "";
  }
  function uploadImg(f, card, i, si) {
    var box = card.querySelector('[data-slot="' + si + '"] .slot-img');
    box.textContent = "올리는 중…";
    shrink(f).then(function (blob) {
      if (assetsCap) return assetsCap.upload(blob).then(function (r) { return r.id; });
      return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.readAsDataURL(blob); });
    }).then(function (ref) { state.slides[i].d.images[si] = ref; changed(); renderCards(); })
      .catch(function (err) {
        var code = err && err.code; box.textContent = "업로드 실패";
        msg(code === "too_large" ? "이미지가 너무 커요. 더 작은 파일로 올려 주세요." : code === "quota_or_state" ? "이미지 저장 공간이 가득 찼어요." : code === "rate_limited" ? "잠시 후 다시 올려 주세요." : "이미지를 올리지 못했어요. PNG나 JPG 파일인지 확인하고 다시 시도해 주세요.", true);
      });
  }
  function save() {
    if (!dirty()) return;
    if (!artifactCap) { canSave = false; refreshBar(); msg("이 화면에서는 저장할 수 없어요. 수정 내용은 이 기기에 임시로 남아 있고, JSON으로 내보낼 수 있어요.", true); return; }
    var next = plain(state); next.rev = (state.rev || 1) + 1;
    saveBtn.disabled = true; stateEl.textContent = "저장 중…";
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: next.rev, data: next })); } catch (e) {}
    artifactCap.publish(buildDocument(next)).then(function () { clearDraft(); stateEl.textContent = "저장했어요. 새 버전을 여는 중…"; }, function (err) {
      var code = err && err.code;
      if (code === "conflict") { stateEl.textContent = "다른 곳에서 먼저 저장했어요. 최신 버전을 여는 중…"; return; }
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: state.rev, data: plain(state) })); } catch (e) {}
      if (/not_writer|not_granted|not_declared|capability_disabled|consent_required/.test(code || "")) { canSave = false; refreshBar(); msg("이 화면은 읽기 전용이라 저장할 수 없어요. JSON으로 내보내 주세요.", true); return; }
      refreshBar();
      msg(code === "too_large" ? "내용이 너무 커서 저장하지 못했어요." : code === "rate_limited" ? "저장을 너무 자주 했어요. 잠시 후 다시 눌러 주세요." : "저장하지 못했어요. 잠시 후 다시 눌러 주세요. 수정 내용은 이 기기에 남아 있어요.", true);
    });
  }

  /* ═════════ 발표 ═════════ */
  var seq = [], pos = 0, step = 0, maxStep = 0, notesOn = false, hideT = null, incCount = 0;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function buildSeq() {
    var inc = state.slides.filter(function (s) { return s.include; });
    incCount = inc.length; seq = [];
    for (var i = 0; i < inc.length; i++) {
      var s = inc[i];
      if (s.type === "hub") {
        var dets = [], nos = [], j = i + 1;
        while (j < inc.length && inc[j].type === "rmd") { dets.push(inc[j]); nos.push(j + 1); j++; }
        for (var k = 0; k <= dets.length; k++) {
          seq.push({ s: s, no: i + 1, ctx: { dets: dets, hubCur: k } });
          if (k < dets.length) seq.push({ s: dets[k], no: nos[k], ctx: { dets: dets, det: k } });
        }
        i = j - 1;
      } else seq.push({ s: s, no: i + 1, ctx: s.type === "rmd" ? { dets: [s], det: 0 } : {} });
    }
  }
  function isCustom(e) { return e && e.s.type === "rmd" && e.s.d.variant === "community"; }
  function ctxFor(e) {
    var c = {}, k;
    for (k in e.ctx) c[k] = e.ctx[k];
    if (isCustom(e)) { c.focus = step % 2 === 1 ? (step - 1) / 2 : null; c.seenN = Math.ceil(step / 2); }
    return c;
  }
  function renderEntry(e) { return slideHtml(e.s, e.no, false, ctxFor(e)); }
  function renderPresent(showOnly) {
    buildSeq();
    if (!seq.length) { location.hash = ""; return; }
    app.className = "";
    pos = Math.min(pos, seq.length - 1);
    app.innerHTML = '<div class="pv" id="pv"><div class="pv-stage"><div class="stage" id="pv-stage"></div></div></div><span class="pv-count" id="pv-count"></span>' +
      '<div class="pv-ui" id="pv-ui"><button type="button" id="u-prev" aria-label="이전">‹</button><button type="button" id="u-next" aria-label="다음">›</button>' +
      (showOnly ? "" : '<button type="button" id="u-note">멘트</button>') + '<button type="button" id="u-full">전체화면</button>' + (showOnly ? "" : '<button type="button" id="u-exit">편집으로</button>') + "</div>" +
      '<div class="pv-note" id="pv-note" hidden></div><div class="pv-progress" id="pv-prog"></div>';
    document.body.style.overflow = "hidden";
    paint(0, false); bindPresent(showOnly); poke();
  }
  function stageEl() { return document.getElementById("pv-stage"); }
  function paint(stepTo, instant) {
    var e = seq[pos], st = stageEl();
    st.className = "stage" + (instant ? " instant" : "");
    if (isCustom(e)) {
      maxStep = arr(e.s.d.boards).length * 2;
      step = stepTo === "max" ? maxStep : stepTo;
      st.innerHTML = renderEntry(e);
    } else {
      step = 0; st.innerHTML = renderEntry(e);
      maxStep = 0; st.querySelectorAll("[data-s]").forEach(function (el) { maxStep = Math.max(maxStep, +el.dataset.s); });
      step = stepTo === "max" ? maxStep : Math.max(stepTo, Math.min(1, maxStep));
      applyStep();
    }
    document.getElementById("pv-count").textContent = e.no + " / " + incCount;
    document.getElementById("pv-prog").style.width = ((pos + 1) / seq.length * 100) + "%";
    var nt = document.getElementById("pv-note"); nt.innerHTML = "<b>발표 멘트</b>" + (esc(e.s.note) || "멘트가 비어 있어요"); nt.hidden = !notesOn;
  }
  function applyStep() {
    var st = stageEl(), instant = st.classList.contains("instant");
    st.querySelectorAll("[data-s]").forEach(function (el) {
      var on = +el.dataset.s <= step;
      el.classList.toggle("off", !on);
      if (on && !el.classList.contains("play")) {
        el.classList.add("play");
        if (!instant && !reduce) { if (el.classList.contains("cnt")) countUp(el); el.querySelectorAll(".cnt").forEach(countUp); }
      } else if (!on) el.classList.remove("play");
    });
  }
  function vt(fn) {
    if (document.startViewTransition && !reduce) { try { document.startViewTransition(fn); return; } catch (err) {} }
    fn();
  }
  function customStep(n) { step = n; var e = seq[pos]; vt(function () { stageEl().className = "stage"; stageEl().innerHTML = renderEntry(e); }); }
  function next() {
    var sl = stageEl().querySelector(".sl");
    if (sl && sl.classList.contains("fmode")) { clearFocus(sl); return; }
    if (isCustom(seq[pos])) { if (step < maxStep) customStep(step + 1); else go(pos + 1, 0); return; }
    if (step < maxStep) { step += 1; applyStep(); return; }
    go(pos + 1, 0);
  }
  function prev() {
    var sl = stageEl().querySelector(".sl");
    if (sl && sl.classList.contains("fmode")) { clearFocus(sl); return; }
    if (isCustom(seq[pos])) { if (step > 0) customStep(step - 1); else go(pos - 1, "max"); return; }
    if (step > Math.min(1, maxStep)) { step -= 1; applyStep(); return; }
    go(pos - 1, "max");
  }
  function go(n, stepTo) {
    if (n < 0 || n >= seq.length) return;
    pos = n;
    vt(function () { paint(stepTo, stepTo === "max"); });
  }
  function clearFocus(sl) { sl.classList.remove("fmode"); sl.querySelectorAll(".fx.on").forEach(function (x) { x.classList.remove("on"); }); delete sl.dataset.pinI; setInfo(sl, null); }
  function poke() {
    var ui = document.getElementById("pv-ui"), ct = document.getElementById("pv-count"); if (!ui) return;
    ui.classList.remove("hide"); ct.classList.remove("hide"); clearTimeout(hideT);
    hideT = setTimeout(function () { ui.classList.add("hide"); ct.classList.add("hide"); }, 2500);
  }
  function toggleNotes() { notesOn = !notesOn; var n = document.getElementById("pv-note"); if (n) n.hidden = !notesOn; }
  function onKey(e) {
    if (mode === "edit") return;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].indexOf(e.key) >= 0) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].indexOf(e.key) >= 0) { e.preventDefault(); prev(); }
    else if (e.key === "Home") go(0, 0);
    else if (e.key === "End") go(seq.length - 1, "max");
    else if ((e.key === "n" || e.key === "N") && mode === "present") toggleNotes();
    else if (e.key === "Escape" && mode === "present" && !document.fullscreenElement) location.hash = "";
  }
  function bindPresent(showOnly) {
    var pv = document.getElementById("pv"), sx = null, sy = null, swiped = false;
    chartEvents(pv);
    pv.addEventListener("click", function (ev) {
      poke();
      if (swiped) { swiped = false; return; }
      var e = seq[pos], sl = stageEl().querySelector(".sl"), t = ev.target;
      var g = t.closest && t.closest("[data-scen],[data-fee]");
      if (g) { gwChange(g); var keep = step; stageEl().className = "stage"; stageEl().innerHTML = renderEntry(e); step = keep; applyStep(); return; }
      var stn = t.closest && t.closest("[data-st]");
      if (stn && e.s.type === "hub") {
        var k = +stn.dataset.st;
        for (var i = 0; i < seq.length; i++) if (seq[i].ctx.dets === e.ctx.dets && seq[i].ctx.det === k) { go(i, 0); return; }
      }
      var bd = t.closest && t.closest("[data-board]");
      if (bd && isCustom(e) && step % 2 === 0) { customStep(+bd.dataset.board * 2 + 1); return; }
      var hit = t.closest && t.closest("[data-chart] [data-i]");
      if (hit) { sl.dataset.pinI = hit.dataset.i; setInfo(sl, +hit.dataset.i); return; }
      var fx = t.closest && t.closest(".fx");
      if (fx && !fx.classList.contains("off") && sl && sl.contains(fx)) {
        var on = !fx.classList.contains("on");
        sl.querySelectorAll(".fx.on").forEach(function (x) { x.classList.remove("on"); });
        fx.classList.toggle("on", on); sl.classList.toggle("fmode", on);
        return;
      }
      if (ev.clientX / window.innerWidth < 0.25) prev(); else next();
    });
    pv.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    pv.addEventListener("touchend", function (e) {
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { swiped = true; setTimeout(function () { swiped = false; }, 400); if (dx < 0) next(); else prev(); }
      sx = null;
    }, { passive: true });
    pv.addEventListener("mousemove", poke);
    document.getElementById("u-prev").onclick = function () { prev(); poke(); };
    document.getElementById("u-next").onclick = function () { next(); poke(); };
    if (!showOnly) {
      document.getElementById("u-note").onclick = function () { toggleNotes(); poke(); };
      document.getElementById("u-exit").onclick = function () { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); location.hash = ""; };
    }
    var fb = document.getElementById("u-full");
    if (!document.documentElement.requestFullscreen) fb.hidden = true;
    fb.onclick = function () { try { var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () { fb.hidden = true; }); } catch (err) { fb.hidden = true; } };
  }
  document.addEventListener("keydown", onKey);


  function route() {
    var h = location.hash;
    mode = h === "#show" ? "show" : h === "#present" ? "present" : "edit";
    if (mode === "edit") renderEditor(); else renderPresent(mode === "show");
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
