<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<title>개발 진행 스케줄</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   개발 진행 스케줄 · v2
   1. 토큰   2. 기본   3. 부품   4. 셸   5. 타임라인
   6. 보드   7. 로그   8. 패널   9. 오버레이  10. 반응형
   ═══════════════════════════════════════════════════════════ */

/* ── 1. 토큰 ─────────────────────────────────────────────── */
:root{
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --r-sm:8px; --r:11px; --r-lg:16px; --r-full:999px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --head:54px; --side:196px; --dock:312px;
  --slot:32px; --bar:26px; --lpad:8px;

  --s-plan:#78879B; --s-act:#4C8DFF; --s-rev:#B57BFF; --s-done:#2FBF71; --s-block:#FF6B5A;
  --k-feat:#2FBF71; --k-imp:#4C8DFF; --k-fix:#FF6B5A; --k-brk:#B57BFF; --k-etc:#78879B;
}
[data-theme="dark"]{
  --bg:#0B0E13; --bg2:#0F141B; --surf:#141A23; --surf2:#1A212C; --surf3:#232C39;
  --line:#1F2833; --line2:#313C4A; --line3:#44525F;
  --tx:#E9EFF6; --tx2:#B4C0CD; --tx3:#7E8D9D;
  --pri:#5B8CFF; --pri-tx:#0A0D12; --acc:#FFB020;
  --wknd:rgba(255,255,255,.024); --hatch:rgba(0,0,0,.45);
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 6px 20px -8px rgba(0,0,0,.65);
  --sh3:0 24px 60px -16px rgba(0,0,0,.78);
  --glass:rgba(20,26,35,.82);
}
[data-theme="light"]{
  --bg:#F4F6F9; --bg2:#EDF1F5; --surf:#FFFFFF; --surf2:#F6F8FB; --surf3:#E9EEF4;
  --line:#E3E8EE; --line2:#CDD6E0; --line3:#AEBAC8;
  --tx:#0F1720; --tx2:#3B4756; --tx3:#6B7A8B;
  --pri:#2F6BFF; --pri-tx:#FFFFFF; --acc:#C87A00;
  --wknd:rgba(15,23,32,.035); --hatch:rgba(255,255,255,.5);
  --sh1:0 1px 2px rgba(22,33,48,.08);
  --sh2:0 6px 18px -8px rgba(22,33,48,.25);
  --sh3:0 24px 56px -16px rgba(22,33,48,.3);
  --glass:rgba(255,255,255,.85);
}

/* ── 2. 기본 ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  font-size:14px;line-height:1.55;letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line3);background-clip:padding-box}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 3. 부품 ─────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 12px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto;
  background:var(--surf2);border:1px solid var(--line);color:var(--tx2);
  transition:background .14s,border-color .14s,color .14s,transform .1s;
}
.btn:hover{background:var(--surf3);color:var(--tx);border-color:var(--line2)}
.btn:active{transform:scale(.975)}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn--pri{background:var(--pri);border-color:transparent;color:var(--pri-tx)}
.btn--pri:hover{background:var(--pri);color:var(--pri-tx);filter:brightness(1.1)}
.btn--ghost{background:transparent;border-color:transparent}
.btn--ghost:hover{background:var(--surf2)}
.btn--danger{color:var(--s-block);border-color:color-mix(in srgb,var(--s-block) 32%,transparent)}
.btn--danger:hover{background:color-mix(in srgb,var(--s-block) 13%,transparent);color:var(--s-block)}
.btn--ico{width:34px;padding:0}
.btn--sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn--sm svg{width:13px;height:13px}
.btn--xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn--full{width:100%}

.ico{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--tx3);flex:0 0 auto;transition:background .13s,color .13s}
.ico:hover{background:var(--surf3);color:var(--tx)}
.ico svg{width:15px;height:15px}
.ico--del:hover{color:var(--s-block)}

.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px;flex:0 0 auto}
.seg button{padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--tx3);white-space:nowrap;transition:all .14s}
.seg button:hover{color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--tx);box-shadow:var(--sh1)}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-full);font-size:11px;font-weight:700;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:999px;flex:0 0 auto}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:5px}
.av{border-radius:9px;display:grid;place-items:center;font-weight:800;color:#0B0E13;flex:0 0 auto;width:28px;height:28px;font-size:12px}
.av--sm{width:21px;height:21px;font-size:10px;border-radius:7px}
.av--lg{width:38px;height:38px;font-size:15px;border-radius:12px}
.bar-mini{height:5px;border-radius:999px;background:var(--surf3);overflow:hidden;min-width:46px}
.bar-mini i{display:block;height:100%;border-radius:999px;transition:width .3s var(--ease)}

.fld{margin-bottom:var(--sp4)}
.lb{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--tx3);margin-bottom:6px;text-transform:uppercase}
.in{width:100%;height:36px;padding:0 11px;border-radius:var(--r-sm);background:var(--surf2);border:1px solid var(--line);transition:border-color .14s,background .14s}
textarea.in{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.62;font-family:inherit}
.in:focus{outline:none;border-color:var(--pri);background:var(--surf3)}
.in:disabled{opacity:.6;cursor:not-allowed}
.in::placeholder{color:var(--tx3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-sm);font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surf2);color:var(--tx3);transition:all .14s}
.chip:hover{border-color:var(--line2);color:var(--tx2)}
.chip[aria-pressed="true"]{color:var(--pri-tx);border-color:transparent}
.chip[disabled]{pointer-events:none;opacity:.7}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-full);font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--surf2);color:var(--tx3);transition:all .14s;flex:0 0 auto}
.fchip:hover{border-color:var(--line2);color:var(--tx2)}
.fchip[aria-pressed="true"]{color:var(--tx);background:var(--surf3);border-color:var(--line2)}
.fchip b{font-size:10.5px;opacity:.65;font-weight:700;font-family:'JetBrains Mono',monospace}

.empty{display:grid;place-items:center;padding:56px 24px;text-align:center}
.empty__in{max-width:340px}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:700}
.empty p{margin:0 0 16px;font-size:12.5px;color:var(--tx3);line-height:1.7}
.empty__art{width:44px;height:44px;margin:0 auto 14px;border-radius:14px;background:var(--surf2);display:grid;place-items:center;color:var(--tx3)}
.empty__art svg{width:21px;height:21px}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.65}

/* ── 4. 셸 ──────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100dvh}
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--sp2);
  height:var(--head);padding:0 var(--sp3);
  background:var(--surf);border-bottom:1px solid var(--line);z-index:60;
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:0}
.brand__m{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--pri),var(--acc));display:grid;place-items:center;flex:0 0 auto}
.brand__m i{width:8px;height:8px;border-radius:2px;background:#fff;display:block;animation:blink 1.4s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
.brand__t{font-size:14px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand__s{display:block;font-size:10px;color:var(--tx3);font-weight:500;white-space:nowrap;margin-top:-2px}

.top__sp{flex:1 1 auto;min-width:8px}
.nav{display:flex;gap:2px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:0 0 auto}
.nav button{
  position:relative;display:flex;align-items:center;gap:7px;height:28px;padding:0 13px;border-radius:7px;
  font-size:13px;font-weight:600;color:var(--tx3);transition:all .16s var(--ease);
}
.nav button svg{width:15px;height:15px}
.nav button:hover{color:var(--tx2)}
.nav button[aria-pressed="true"]{background:var(--surf);color:var(--tx);box-shadow:var(--sh1)}
.nav .n{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--s-block);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;font-family:'JetBrains Mono',monospace}
.nav button[aria-pressed="true"] .n{background:var(--pri);color:var(--pri-tx)}

.top__r{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.search{position:relative;width:34px;transition:width .22s var(--ease)}
.search.is-open{width:210px}
.search input{width:100%;height:34px;padding:0 10px 0 32px;border-radius:var(--r-sm);background:var(--surf2);border:1px solid var(--line);opacity:0;transition:opacity .16s}
.search.is-open input{opacity:1}
.search__i{position:absolute;left:9px;top:0;bottom:0;width:16px;display:grid;place-items:center;color:var(--tx3);pointer-events:none;z-index:1}
.search__i svg{width:15px;height:15px;display:block}
.search button{position:absolute;inset:0;width:34px;border-radius:var(--r-sm)}
.search.is-open button{pointer-events:none}
.search input:focus{outline:none;border-color:var(--pri)}

.me{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 5px;border-radius:var(--r-full);background:var(--surf2);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.me:hover{border-color:var(--line2)}
.bell{position:relative}
.bell__n{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--s-block);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;box-shadow:0 0 0 2px var(--surf)}

.sub{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;height:44px;padding:0 var(--sp3);
  background:var(--surf);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:50;
}
.sub::-webkit-scrollbar{display:none}
.sub__sp{flex:1 1 auto;min-width:8px}
.div{width:1px;height:18px;background:var(--line);flex:0 0 auto;margin:0 3px}

.main{flex:1 1 auto;display:flex;min-height:0;position:relative}
.stage{flex:1 1 auto;min-width:0;overflow:auto;position:relative;overscroll-behavior:contain}
.demo{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;
  display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:var(--r-full);
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line2);
  font-size:12px;font-weight:600;color:var(--tx2);box-shadow:var(--sh2);
}
.demo i{width:7px;height:7px;border-radius:999px;background:var(--acc);flex:0 0 auto}

/* ── 5. 타임라인 ────────────────────────────────────────── */
.tl{display:flex;align-items:flex-start;min-height:100%;width:max-content;min-width:100%}
.tl__side{position:sticky;left:0;z-index:20;flex:0 0 var(--side);width:var(--side);background:var(--surf);border-right:1px solid var(--line2)}
[data-theme="dark"] .tl__side{box-shadow:12px 0 20px -18px rgba(0,0,0,.9)}
.tl__side.is-min{--side:0px;flex-basis:0;width:0;overflow:hidden;border-right:none}
.tl__sh{
  position:sticky;top:0;z-index:5;height:var(--head);display:flex;align-items:flex-end;
  justify-content:space-between;gap:6px;padding:0 6px 8px 10px;background:var(--surf);
  border-bottom:1px solid var(--line2);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--tx3);
}
.grip{position:absolute;top:0;right:-3px;width:6px;height:100%;z-index:25;cursor:col-resize;transition:background .12s}
.grip:hover,.grip.is-on{background:color-mix(in srgb,var(--pri) 55%,transparent)}
.tl__side.is-min .grip{display:none}
.unfold{position:fixed;left:8px;z-index:40;width:26px;height:26px;border-radius:8px;background:var(--surf3);border:1px solid var(--line2);display:grid;place-items:center;color:var(--tx3);box-shadow:var(--sh1)}
.unfold:hover{color:var(--tx)}
.unfold svg{width:14px;height:14px}

.tl__main{position:relative;flex:0 0 auto}
.tl__head{position:sticky;top:0;z-index:15;height:var(--head);background:var(--surf);border-bottom:1px solid var(--line2)}
.months{display:flex;height:26px;align-items:center}
.month{position:relative;height:26px;display:flex;align-items:center;padding-left:9px;font-size:11px;font-weight:700;color:var(--tx2);border-left:1px solid var(--line2);overflow:hidden;white-space:nowrap}
.month:first-child{border-left:none}
.ticks{display:flex;height:27px}
.tick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--line);color:var(--tx3);font-size:10px;line-height:1.1;overflow:hidden}
.tick b{font-weight:600;font-size:11px;color:var(--tx2);font-family:'JetBrains Mono',monospace}
.tick em{font-style:normal;font-size:8.5px}
.tick--we b,.tick--we em{opacity:.6}
.tick--sun b{color:var(--s-block);opacity:.8}
.tick--now{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.tick--now b{color:var(--acc)}
.layer{position:absolute;inset:var(--head) 0 0 0;pointer-events:none;z-index:0}
.band{position:absolute;top:0;bottom:0;background:var(--wknd)}
.mline{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);opacity:.55}
.now{position:absolute;top:calc(var(--head) - 27px);bottom:0;width:2px;z-index:12;background:var(--acc);pointer-events:none;box-shadow:0 0 12px color-mix(in srgb,var(--acc) 55%,transparent)}
.now::before{content:'';position:absolute;top:-1px;left:-3px;width:8px;height:8px;border-radius:999px;background:var(--acc)}
.now::after{content:'';position:absolute;top:-6px;left:-8px;width:18px;height:18px;border-radius:999px;background:var(--acc);opacity:.25;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.4}70%,100%{transform:scale(2);opacity:0}}

.lane{position:relative;border-bottom:1px solid var(--line)}
.lane--off{background:color-mix(in srgb,var(--tx3) 5%,transparent)}
.lane.is-drop{background:color-mix(in srgb,var(--pri) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pri) 45%,transparent)}
.lane.is-lift{opacity:.4}
.lane.is-ins{box-shadow:inset 0 2px 0 var(--pri)}
.lane.is-ins-b{box-shadow:inset 0 -2px 0 var(--pri)}
.lh{display:flex;align-items:center;gap:7px;height:100%;padding:0 5px 0 6px;overflow:hidden}
.lh__t{width:20px;height:20px;flex:0 0 auto;display:grid;place-items:center;border-radius:5px;color:var(--tx3);transition:transform .18s var(--ease),background .13s}
.lh__t:hover{background:var(--surf3);color:var(--tx)}
.lh__t svg{width:13px;height:13px}
.lh.is-closed .lh__t{transform:rotate(-90deg)}
.lh__c{width:4px;align-self:stretch;margin:9px 0;border-radius:999px;flex:0 0 auto}
.lh__b{flex:1 1 auto;min-width:0}
.lh__n{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;padding:1px 3px;margin-left:-3px}
.lh__n[contenteditable="true"]:focus{background:var(--surf3);outline:none}
.lh__s{font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-top:1px}
.lh__a{display:flex;gap:1px;flex:0 0 auto;opacity:0;transition:opacity .13s}
.lane:hover .lh__a,.lh__a:focus-within{opacity:1}
.lh__g{width:18px;flex:0 0 auto;display:grid;place-items:center;color:var(--tx3);cursor:grab;opacity:0;transition:opacity .13s;touch-action:none}
.lane:hover .lh__g{opacity:.7}
.lh__g svg{width:12px;height:12px}
@media (hover:none){.lh__a,.lh__g{opacity:.65}}

.track{position:relative;width:100%;height:100%}
.bar{
  position:absolute;height:var(--bar);border-radius:8px;display:flex;align-items:center;gap:5px;
  padding:0 9px;min-width:12px;color:#0B0E13;font-weight:700;font-size:11.5px;overflow:hidden;
  cursor:grab;user-select:none;touch-action:pan-y;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),var(--sh1);
  transition:box-shadow .16s,filter .16s,opacity .16s;
}
.bar:hover{filter:brightness(1.08);box-shadow:0 0 0 2px color-mix(in srgb,var(--tx) 25%,transparent),var(--sh2)}
.bar.is-drag{cursor:grabbing;z-index:9;filter:brightness(1.12);box-shadow:0 0 0 2px var(--pri),var(--sh3)}
.bar.is-sel{box-shadow:0 0 0 2px var(--tx),var(--sh2)}
.bar.is-ro{cursor:pointer}
.bar.is-done{opacity:.58}
.bar.is-dim{opacity:.2;filter:grayscale(.7)}
.bar__f{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);pointer-events:none}
.bar__off{position:absolute;top:0;bottom:0;pointer-events:none;background-color:color-mix(in srgb,var(--bg) 58%,transparent);background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 2px,transparent 2px 6px)}
.bar__x{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.bar__i{position:relative;z-index:1;flex:0 0 auto;display:grid;place-items:center;opacity:.7}
.bar__i svg{width:11px;height:11px}
.bar__n{position:relative;z-index:1;flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;height:15px;font-size:9.5px;font-weight:800;padding:0 5px;border-radius:999px}
.bar__ni{display:grid;place-items:center;width:9px;height:9px}
.bar__ni svg{width:9px;height:9px;display:block}
.bar__n--log{background:rgba(255,255,255,.34);border:1px solid rgba(0,0,0,.18)}
.bar__n--cm{background:rgba(0,0,0,.3);color:#fff;border:1px solid transparent}
.bar__h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2;opacity:0;transition:opacity .13s}
.bar__h::after{content:'';position:absolute;top:8px;bottom:8px;left:3.5px;width:2.5px;border-radius:2px;background:rgba(0,0,0,.4)}
.bar:hover .bar__h{opacity:1}
.bar__h--l{left:0}.bar__h--r{right:0}
.bar--xs{padding:0 4px;gap:2px}
.bar--xs .bar__x{display:none}
.vac{position:absolute;height:20px;border-radius:7px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;overflow:hidden;white-space:nowrap;cursor:pointer;user-select:none;border:1px solid}
.vac span{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis}
.vac::before{content:'';position:absolute;inset:0;opacity:.42;background-image:repeating-linear-gradient(-45deg,currentColor 0 1.5px,transparent 1.5px 7px)}
.sumbar{position:absolute;height:6px;top:50%;transform:translateY(-50%);border-radius:999px;opacity:.38;pointer-events:none}

.tip{position:fixed;z-index:200;pointer-events:none;padding:6px 10px;border-radius:8px;background:var(--tx);color:var(--bg);font-size:11.5px;font-weight:700;font-family:'JetBrains Mono',monospace;white-space:nowrap;box-shadow:var(--sh2);opacity:0;transform:translate(-50%,-150%);transition:opacity .1s}
.tip.is-on{opacity:1}
.pop{position:fixed;z-index:190;width:304px;max-width:calc(100vw - 24px);background:var(--surf);border:1px solid var(--line2);border-radius:var(--r-lg);padding:13px 14px;box-shadow:var(--sh3);opacity:0;pointer-events:none;transform:translateY(5px);transition:opacity .14s,transform .14s}
.pop.is-on{opacity:1;transform:none}
.pop__t{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:6px}
.pop__m{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-bottom:9px}
.pop__memo{font-size:12px;color:var(--tx2);line-height:1.62;white-space:pre-wrap;background:var(--surf2);border-radius:9px;padding:9px 10px;max-height:112px;overflow:hidden;margin-bottom:8px}
.pop__h{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--tx3);margin-bottom:5px}
.pop__c{display:flex;gap:7px;margin-top:6px;font-size:11.5px}
.pop__c b{flex:0 0 auto;font-weight:700}
.pop__c span{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.zoom{display:flex;align-items:center;gap:1px;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;flex:0 0 auto}
.zoom button{width:26px;height:26px;border-radius:6px;color:var(--tx3);display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}
.zoom button:hover{background:var(--surf3);color:var(--tx)}
.zoom input{width:84px;accent-color:var(--pri);height:20px;margin:0 4px}

/* ── 6. 보드 ────────────────────────────────────────────── */
.board{display:flex;gap:var(--sp3);padding:var(--sp4);height:100%;align-items:flex-start;min-width:min-content}
.col{flex:1 1 0;min-width:250px;max-width:380px;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);max-height:100%}
.col.is-over{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 7%,var(--bg2))}
.col__h{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 13px 10px}
.col__h b{font-size:12.5px;font-weight:700}
.col__h .n{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-left:-3px}
.col__l{flex:1 1 auto;overflow-y:auto;padding:0 9px 9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col__add{margin:0 9px 10px;height:34px;border-radius:9px;border:1px dashed var(--line2);color:var(--tx3);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .14s}
.col__add:hover{border-color:var(--pri);color:var(--pri);background:color-mix(in srgb,var(--pri) 7%,transparent)}
.col__add svg{width:13px;height:13px}
.qadd{margin:0 9px 10px;position:relative}
.qadd input{width:100%;height:34px;padding:0 10px;border-radius:9px;background:var(--surf);border:1px dashed var(--line2);font-size:12.5px}
.qadd input:focus{outline:none;border-style:solid;border-color:var(--pri);background:var(--surf2)}

.card{
  position:relative;text-align:left;width:100%;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px;transition:border-color .14s,transform .12s,box-shadow .14s;
  cursor:pointer;
}
.card:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.card.is-drag{opacity:.5}
.card.is-new{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.card.is-new::after{content:'';position:absolute;top:11px;right:11px;width:6px;height:6px;border-radius:999px;background:var(--acc)}
.card__top{display:flex;align-items:center;gap:5px;margin-bottom:7px;flex-wrap:wrap}
.card__t{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:6px;padding-right:10px}
.card__b{font-size:11.5px;color:var(--tx3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.card__f{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.card__link{margin-top:8px;padding:8px 9px;border-radius:9px;background:var(--surf2);border:1px solid var(--line)}
.card__link .t{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.card__link .m{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-top:5px}
.card__more{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.memo{font-size:12px;color:var(--tx2);line-height:1.62;white-space:pre-wrap;background:var(--surf2);border-radius:9px;padding:9px 10px;display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden}
.minic{display:flex;gap:7px;margin-top:8px}
.minic b{font-size:10.5px;font-weight:700;color:var(--tx2);display:block}
.minic p{margin:0;font-size:11.5px;color:var(--tx3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morebtn{display:block;width:100%;margin-top:9px;padding:6px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--tx3);background:var(--surf2)}
.morebtn:hover{color:var(--tx);background:var(--surf3)}
.expand{position:absolute;bottom:9px;right:9px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--tx3);background:var(--surf2)}
.expand:hover{color:var(--tx);background:var(--surf3)}
.expand svg{width:13px;height:13px;transition:transform .18s var(--ease)}
.expand.is-open svg{transform:rotate(180deg)}
.orig{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:999px;font-size:9.5px;font-weight:800}
.lock{font-size:10px;color:var(--tx3);display:inline-flex;align-items:center;gap:3px}

/* ── 7. 로그 ────────────────────────────────────────────── */
.log{padding:var(--sp4);max-width:780px;margin:0 auto}
.lgroup{position:relative;padding-left:24px;padding-bottom:26px}
.lgroup::before{content:'';position:absolute;left:5px;top:10px;bottom:-4px;width:2px;background:var(--line)}
.lgroup:last-child::before{bottom:auto;height:14px}
.lgroup::after{content:'';position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:999px;background:var(--pri);box-shadow:0 0 0 3px var(--bg)}
.lgroup__h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.lgroup__v{font-size:15px;font-weight:700;letter-spacing:-.02em}
.lgroup__d{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.litem{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.litem:last-child{border-bottom:none}
.litem__b{flex:1 1 auto;min-width:0}
.litem__t{font-size:13.5px;font-weight:600;line-height:1.5}
.litem__x{font-size:12px;color:var(--tx3);line-height:1.62;white-space:pre-wrap;margin-top:3px}
.litem__l{font-size:10.5px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-top:5px;display:inline-flex;gap:5px}
.litem__l:hover{color:var(--pri)}
.kind{flex:0 0 auto;height:21px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;margin-top:2px}
.litem__a{display:flex;gap:2px;opacity:0;transition:opacity .13s;flex:0 0 auto}
.litem:hover .litem__a{opacity:1}

/* 로그 줄 (패널 안) */
.lrow{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line)}
.lrow:last-of-type{border-bottom:none}
.lrow__b{flex:1 1 auto;min-width:0}
.lrow__t{font-size:12.5px;font-weight:600;cursor:text;border-radius:5px;padding:2px 4px;margin-left:-4px}
.lrow__t:hover{background:var(--surf2)}
.lrow__d{font-size:10.5px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.lrow--done .lrow__t{text-decoration:line-through;text-decoration-color:var(--line2);color:var(--tx3)}
.sdot{width:20px;height:20px;flex:0 0 auto;display:grid;place-items:center;border-radius:999px;cursor:pointer}
.sdot i{width:10px;height:10px;border-radius:999px;border:2px solid currentColor}
.sdot.is-doing i{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.sdot.is-done i{background:currentColor}
.addline{position:relative;margin-top:6px}
.addline input{width:100%;height:34px;padding:0 11px;border-radius:9px;background:var(--surf2);border:1px dashed var(--line2);font-size:12.5px}
.addline input:focus{outline:none;border-style:solid;border-color:var(--pri);background:var(--surf3)}

/* 달력 (휴무일) */
.cal{display:flex;gap:14px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin;align-items:flex-start}
.cal__m{flex:0 0 190px;width:190px;min-width:190px}
.cal__t{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.cal__g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal__w{font-size:9px;color:var(--tx3);text-align:center;padding-bottom:2px}
.cal__d{height:24px;border-radius:6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--tx3);display:grid;place-items:center;background:transparent;transition:all .12s}
.cal__d.in{background:var(--surf2);color:var(--tx2);cursor:pointer}
.cal__d.in:hover{background:var(--surf3);color:var(--tx)}
.cal__d.off{background:repeating-linear-gradient(-45deg,var(--line2) 0 2px,var(--surf2) 2px 6px);color:var(--tx3);text-decoration:line-through}
.cal__d.today{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}
.cal__d.out{opacity:.25}

/* ── 8. 패널 ────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(5,8,12,.55);backdrop-filter:blur(0px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,backdrop-filter .2s,visibility 0s linear .2s}
.scrim.is-on{opacity:1;visibility:visible;pointer-events:auto;backdrop-filter:blur(3px);transition:opacity .2s,backdrop-filter .2s,visibility 0s}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:100;width:min(440px,100vw);background:var(--surf);border-left:1px solid var(--line2);display:flex;flex-direction:column;box-shadow:var(--sh3);transform:translateX(101%);transition:transform .3s var(--ease)}
.panel.is-on{transform:none}
.panel__h{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:11px 10px 11px 16px;border-bottom:1px solid var(--line);position:relative}
.panel__e{flex:1 1 auto;display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--tx3);font-family:'JetBrains Mono',monospace;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel__b{flex:1 1 auto;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.panel__t{width:100%;font-size:19px;font-weight:700;letter-spacing:-.025em;line-height:1.35;background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 9px;margin:-6px -9px 14px;resize:none;overflow:hidden;font-family:inherit}
.panel__t:focus{outline:none;background:var(--surf2);border-color:var(--line2)}
.sect{margin-bottom:18px}
.sect__h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sect__h b{font-size:12.5px;font-weight:700}
.sect__h span{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.hr{height:1px;background:var(--line);margin:18px -16px}
.dur{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-top:7px}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.quick button{height:26px;padding:0 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surf2);border:1px solid var(--line);color:var(--tx3)}
.quick button:hover{color:var(--tx);border-color:var(--line2)}
.rng{width:100%;accent-color:var(--pri);height:22px}

.cm{display:flex;gap:9px;margin-bottom:13px}
.cm--re{margin-left:34px}
.cm__b{flex:1 1 auto;min-width:0}
.cm__m{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.cm__m b{font-size:12.5px;font-weight:700}
.cm__m time{font-size:10.5px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.cm__x{opacity:0;margin-left:auto;color:var(--tx3);font-size:11px;transition:opacity .13s}
.cm:hover .cm__x{opacity:1}
.cm__x:hover{color:var(--s-block)}
.cm__t{font-size:13px;color:var(--tx2);white-space:pre-wrap;word-break:break-word;line-height:1.65}
.cm__a{display:flex;gap:8px;margin-top:4px}
.cm__a button{font-size:10.5px;font-weight:700;color:var(--tx3)}
.cm__a button:hover{color:var(--pri)}
.at{font-weight:700;color:var(--pri)}
.rebox{margin:6px 0 12px 34px;display:flex;gap:6px}
.rebox textarea{flex:1 1 auto;min-height:38px;max-height:120px;padding:7px 9px;border-radius:8px;resize:none;background:var(--surf2);border:1px solid var(--line2);font-family:inherit;font-size:12.5px;line-height:1.5}
.rebox textarea:focus{outline:none;border-color:var(--pri)}
.write{background:var(--surf);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));flex:0 0 auto}
.write__m{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:11px;color:var(--tx3)}
.write__m b{color:var(--tx2);font-weight:700}
.write__m button{font-size:11px;color:var(--pri);font-weight:600}
.write textarea{width:100%;min-height:54px;max-height:170px;padding:9px 11px;border-radius:10px;resize:none;background:var(--surf2);border:1px solid var(--line);line-height:1.55;font-family:inherit}
.write textarea:focus{outline:none;border-color:var(--pri);background:var(--surf3)}
.write__r{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}

/* ── 9. 오버레이 ───────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:16px;background:rgba(5,8,12,.62);backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s linear .2s}
.modal.is-on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s,visibility 0s}
.modal__c{width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh3);transform:translateY(10px) scale(.985);transition:transform .24s var(--ease)}
.modal.is-on .modal__c{transform:none}
.modal h2{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.modal p{margin:0 0 16px;font-size:12.5px;color:var(--tx3);line-height:1.65}
.err{font-size:12px;color:var(--s-block);margin-top:8px;min-height:15px;font-weight:600}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.whob{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surf2);transition:all .14s}
.whob:hover{border-color:var(--pri);background:var(--surf3);transform:translateY(-1px)}
.whob span{font-size:13px;font-weight:700}
.tabs{display:flex;gap:2px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;padding:6px 4px;border-radius:6px;font-size:12px;font-weight:600;color:var(--tx3);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surf);color:var(--tx);box-shadow:var(--sh1)}
.prow{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:none}
.sw{width:26px;height:26px;border-radius:8px;border:none;padding:0;cursor:pointer;flex:0 0 auto;background:none;overflow:hidden}
.sw::-webkit-color-swatch-wrapper{padding:0}
.sw::-webkit-color-swatch{border:none;border-radius:8px}
.prow input[type=text]{flex:1 1 auto;min-width:0;height:32px;padding:0 9px;border-radius:7px;background:var(--surf2);border:1px solid var(--line)}
.prow input[type=text]:focus{outline:none;border-color:var(--pri)}
.note{font-size:11.5px;color:var(--tx3);line-height:1.65;background:var(--surf2);border-radius:10px;padding:10px 12px;margin-top:12px}

.menu{position:fixed;z-index:210;min-width:176px;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r);padding:5px;box-shadow:var(--sh3);opacity:0;pointer-events:none;transform:scale(.97);transform-origin:top left;transition:opacity .12s,transform .12s}
.menu.is-on{opacity:1;pointer-events:auto;transform:none}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--tx2);text-align:left}
.menu button:hover{background:var(--surf3);color:var(--tx)}
.menu button.dgr{color:var(--s-block)}
.menu button.dgr:hover{background:color-mix(in srgb,var(--s-block) 13%,transparent)}
.menu button svg{width:14px;height:14px;flex:0 0 auto;opacity:.8}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
.menu .k{margin-left:auto;font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace}

.notif{position:fixed;z-index:180;width:344px;max-width:calc(100vw - 16px);max-height:min(460px,70dvh);display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:var(--sh3);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .16s,transform .16s}
.notif.is-on{opacity:1;pointer-events:auto;transform:none}
.notif__h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif__h b{font-size:13px;font-weight:700;flex:1 1 auto}
.notif__l{flex:1 1 auto;overflow-y:auto;padding:5px}
.nrow{display:flex;gap:9px;width:100%;padding:9px;border-radius:9px;text-align:left;transition:background .12s}
.nrow:hover{background:var(--surf2)}
.nrow__b{flex:1 1 auto;min-width:0}
.nrow__t{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow__s{font-size:11.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.nrow__d{font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace;margin-top:2px}

.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 12px}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--tx);color:var(--bg);font-size:12.5px;font-weight:700;box-shadow:var(--sh3);animation:tin .3s var(--ease)}
.toast--bad{background:var(--s-block);color:#fff}
.toast button{color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px;pointer-events:auto}
.toast.out{animation:tout .25s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px) scale(.96)}}

.boot{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:var(--bg);transition:opacity .3s}
.boot.off{opacity:0;pointer-events:none}
.boot i{width:5px;height:22px;border-radius:3px;background:var(--line2);display:inline-block;margin:0 2px;animation:bnc 1.1s var(--ease) infinite}
.boot i:nth-child(2){animation-delay:.12s}
.boot i:nth-child(3){animation-delay:.24s}
.boot i:nth-child(4){animation-delay:.36s}
@keyframes bnc{0%,100%{transform:scaleY(.45);opacity:.4}50%{transform:scaleY(1);opacity:1;background:var(--pri)}}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.keyrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
.keyrow kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;border:1px solid var(--line2);background:var(--surf2);border-radius:5px;padding:2px 6px;min-width:26px;text-align:center;flex:0 0 auto}
.ghost{position:fixed;z-index:250;pointer-events:none;padding:8px 12px;border-radius:10px;background:var(--pri);color:var(--pri-tx);font-size:12px;font-weight:700;box-shadow:var(--sh3);opacity:0;transform:translate(-50%,-50%);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost.is-on{opacity:.95}

/* ── 10. 반응형 ────────────────────────────────────────── */
@media (max-width:1060px){ .brand__t,.brand__s{display:none} }
@media (max-width:860px){ .nav button span{display:none} .nav button{padding:0 11px} }

  :root{--slot:30px;--bar:24px}
  .top{padding:0 10px;gap:5px}
  .search.is-open{width:150px}
  .lh__s{display:none}
  .panel{top:auto;left:0;right:0;bottom:0;width:100vw;height:92dvh;border-left:none;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(101%)}
  .panel.is-on{transform:none}
  .panel__h::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:999px;background:var(--line2)}
  .modal__c{max-width:none}
  .board{padding:var(--sp3);gap:var(--sp2)}
  .col{min-width:80vw;max-width:80vw}

  .pop{display:none}
  .notif{width:calc(100vw - 16px)}

/* ── 5. 파생 ─────────────────────────────────────────────── */
const live = () => S.tasks.filter(t => !t.is_archived);
const memOf = id => S.members.find(m => m.id === id);
const vwOf = id => S.viewers.find(v => v.id === id);
const phOf = id => S.phases.find(p => p.id === id);
const taskOf = id => S.tasks.find(t => t.id === id);
const reqOf = id => S.requests.find(r => r.id === id);
const cmOfTask = id => S.comments.filter(c => c.task_id === id);
const cmOfReq = id => S.comments.filter(c => c.request_id === id);
const relOfTask = id => S.releases.filter(r => r.task_id === id)
  .sort((a, b) => ({ doing: 0, todo: 1, done: 2 }[a.status || 'done'] - { doing: 0, todo: 1, done: 2 }[b.status || 'done']));
const relOfReq = id => S.releases.filter(r => r.request_id === id);
const offOf = id => S.offdays.filter(o => o.task_id === id).map(o => o.day);

const unreadTask = id => S.owner
  ? S.comments.filter(c => c.task_id === id && !c.is_owner && !c.read_by_owner).length
  : Math.max(cmOfTask(id).length - (S.seen[id] || 0), 0);
const unreadReq = id => S.owner
  ? S.comments.filter(c => c.request_id === id && !c.is_owner && !c.read_by_owner).length + (reqOf(id)?.read_by_owner === false ? 1 : 0)
  : Math.max(cmOfReq(id).length - (S.seen['r' + id] || 0), 0);

function offDays(t) {
  const s = pd(t.start_date), e = pd(t.end_date);
  return offOf(t.id).filter(d => pd(d) >= s && pd(d) <= e);
}
const totalDays = t => dDiff(pd(t.start_date), pd(t.end_date)) + 1;
const workDays = t => Math.max(totalDays(t) - offDays(t).length, 0);

/* 요청 표시 상태: 연결 작업이 있으면 작업을 따라감 */
function rStatus(r) {
  if (r.status === 'rejected') return 'done';
  const t = r.task_id && taskOf(r.task_id);
  if (t) return t.status === 'done' ? 'done' : 'planned';
  return r.status;
}
const backlog = () => S.requests.filter(r => S.owner || r.is_public !== false);
function boardItems() {
  const q = S.q.trim().toLowerCase();
  return backlog()
    .filter(r => S.boardTab === 'all' || (r.origin || 'request') === S.boardTab)
    .filter(r => !q || `${r.title} ${r.body} ${r.author}`.toLowerCase().includes(q));
}

function matchTask(t) {
  const q = S.q.trim().toLowerCase();
  if (S.fStatus.size && !S.fStatus.has(t.status)) return false;
  if (S.fWho && t.assignee_id !== S.fWho) return false;
  if (q) {
    const rel = relOfTask(t.id).map(r => r.title + ' ' + r.body).join(' ');
    if (!`${t.title} ${t.description || ''} ${rel}`.toLowerCase().includes(q)) return false;
  }
  return true;
}
const visTasks = () => live().filter(t => matchTask(t) && (S.showHidden || !S.hidden.has(t.id)));

function computeRange() {
  const items = [...live(), ...S.leaves];
  const T = mid(new Date());
  let min = T, max = T;
  items.forEach(t => { const s = pd(t.start_date), e = pd(t.end_date); if (s < min) min = s; if (e > max) max = e; });
  let start = addD(min, -14);
  start = addD(start, -((start.getDay() + 6) % 7));
  const end = new Date(Math.max(+addD(T, 190), +addD(max, 28)));
  S.range = { s: start, days: Math.ceil((dDiff(start, end) + 1) / 7) * 7 };
}
const xOf = s => dDiff(S.range.s, pd(s)) * S.dayW;
const wOf = (a, b) => Math.max((dDiff(pd(a), pd(b)) + 1) * S.dayW - 2, 10);

function pack(items, gap = 6) {
  const rows = [];
  items.slice().sort((a, b) => pd(a.start_date) - pd(b.start_date) || pd(b.end_date) - pd(a.end_date))
    .forEach(it => {
      const s = xOf(it.start_date), e = s + wOf(it.start_date, it.end_date);
      let r = 0;
      for (;;) {
        if (!rows[r]) rows[r] = [];
        if (!rows[r].some(x => !(e + gap <= x.s || s >= x.e + gap))) { rows[r].push({ s, e }); it.__row = r; break; }
        r++;
      }
    });
  return Math.max(rows.length, 1);
}
function buildLanes() {
  const lanes = [], tasks = visTasks();
  if (S.group === 'phase') {
    if (S.leaves.length) {
      const order = S.members.map(m => m.id).filter(id => S.leaves.some(l => l.member_id === id));
      S.leaves.forEach(l => { if (!order.includes(l.member_id)) order.push(l.member_id); });
      const items = S.leaves.map(l => ({ ...l, _t: 'vac', __row: Math.max(order.indexOf(l.member_id), 0) }));
      lanes.push({ id: '__vac', name: '휴가', color: cvar('--tx3'), kind: 'vac', items, rows: Math.max(order.length, 1) });
    }
    S.phases.forEach(p => {
      const items = tasks.filter(t => t.phase_id === p.id).map(t => ({ ...t, _t: 'task' }));
      lanes.push({ id: p.id, name: p.name, color: p.color, kind: 'phase', items, rows: pack(items) });
    });
    const loose = tasks.filter(t => !t.phase_id || !phOf(t.phase_id)).map(t => ({ ...t, _t: 'task' }));
    if (loose.length || S.owner) lanes.push({ id: '__none', name: '미분류', color: cvar('--tx3'), kind: 'phase', items: loose, rows: pack(loose) });
  } else {
    S.members.filter(m => m.active).forEach(m => {
      const items = [
        ...tasks.filter(t => t.assignee_id === m.id).map(t => ({ ...t, _t: 'task' })),
        ...S.leaves.filter(l => l.member_id === m.id).map(l => ({ ...l, _t: 'vac' }))
      ];
      lanes.push({ id: m.id, name: m.name, color: m.color, kind: 'member', items, rows: pack(items) });
    });
    const loose = tasks.filter(t => !t.assignee_id || !memOf(t.assignee_id)).map(t => ({ ...t, _t: 'task' }));
    if (loose.length || S.owner) lanes.push({ id: '__none', name: '미배정', color: cvar('--tx3'), kind: 'member', items: loose, rows: pack(loose) });
  }
  return lanes;
}

/* ── 데이터 조작 (낙관적 반영 + 실패 시 롤백) ─────────────── */
async function mut(fn, ok, undo) {
  try { await fn(); render(); if (ok) toast(ok, false, undo); }
  catch (e) { toast('저장하지 못했습니다: ' + (e.message || e), true); await reload(); }
}
async function upTask(id, patch, ok, undo) {
  const t = taskOf(id); if (!t) return;
  const prev = {}; Object.keys(patch).forEach(k => prev[k] = t[k]);
  Object.assign(t, patch); render(); if (S.sel === id) renderPanel();
  try {
    await DB.update('tasks', id, patch);
    if (patch.status) await syncRequestOf(t);
  } catch (e) { Object.assign(t, prev); render(); toast('저장 실패: ' + e.message, true); return; }
  if (ok) toast(ok, false, undo);
}
async function upReq(id, patch, ok) {
  const r = reqOf(id); if (!r) return;
  const prev = {}; Object.keys(patch).forEach(k => prev[k] = r[k]);
  Object.assign(r, patch); render(); if (S.sel === id) renderPanel();
  try { await DB.update('requests', id, patch); }
  catch (e) { Object.assign(r, prev); render(); toast('저장 실패: ' + e.message, true); return; }
  if (ok) toast(ok);
}
async function upRel(id, patch) {
  const r = S.releases.find(x => x.id === id); if (!r) return;
  Object.assign(r, patch); render(); if (S.sel) renderPanel();
  try { await DB.update('releases', id, patch); } catch (e) { toast('저장 실패: ' + e.message, true); await reload(); }
}

/* 작업 완료 → 연결된 요청 상태 + 로그 자동 생성 (두 번 적지 않도록) */
async function syncRequestOf(t) {
  const r = S.requests.find(x => x.task_id === t.id);
  if (!r) return;
  const want = t.status === 'done' ? 'done' : 'planned';
  if (r.status !== want) { r.status = want; await DB.update('requests', r.id, { status: want }); }
  if (t.status === 'done' && !r.logged && !relOfReq(r.id).length) {
    const row = {
      task_id: t.id, request_id: r.id, title: r.title, body: '',
      kind: (r.origin === 'plan' ? 'improve' : 'feature'),
      status: 'done', released_on: today(), version: lastVersion(), sort: 0
    };
    const made = await DB.insert('releases', row);
    S.releases.unshift(made);
    r.logged = true; await DB.update('requests', r.id, { logged: true });
    render();
    toast('로그에 자동으로 기록했습니다', false, { t: '다듬기', fn: () => openRelModal(made) });
  }
}
const lastVersion = () => (S.releases.map(r => (r.version || '').trim()).filter(Boolean)[0] || '');

async function createTask(o = {}) {
  const st = o.start ? pd(o.start) : new Date();
  const row = {
    phase_id: o.phase_id ?? null, assignee_id: o.assignee_id ?? null,
    assignee: memOf(o.assignee_id)?.name || '',
    title: o.title || '새 작업', status: 'planned', description: o.description || '', progress: 0,
    start_date: fd(st), end_date: fd(addD(st, (o.days || 3) - 1)), is_archived: false
  };
  try {
    const t = await DB.insert('tasks', row);
    S.tasks.push(t); render();
    if (!o.silent) { openTask(t.id); setTimeout(() => { const el = $('#panelTitle'); el && (el.focus(), el.select()); }, 320); }
    return t;
  } catch (e) { toast('작업을 만들지 못했습니다: ' + e.message, true); }
}

}

function viewTimeline() {
  computeRange();

      px < 48 ? `${d.getMonth() + 1}` : `${d.getFullYear()}. ${String(d.getMonth() + 1).padStart(2, '0')}월`));

  }

    for (let k = 0; k < days; k++) {

      add(ticks, h('div', {
        class: 'tick' + (wd % 6 === 0 ? ' tick--we' : '') + (wd === 0 ? ' tick--sun' : '') + (fd(d) === tstr ? ' tick--now' : ''),

    }

    const showLb = 7 * w >= 30;
    for (let k = 0; k < days; k += 7) {
      const d = addD(s, k), off = dDiff(d, mid(new Date()));
      add(ticks, h('div', { class: 'tick' + (off >= 0 && off < 7 ? ' tick--now' : ''), style: `width:${7 * w}px` },
        showLb ? h('b', {}, w >= 7 ? `${d.getMonth() + 1}/${d.getDate()}` : String(d.getDate())) : null));
    }

    if (d.getDate() === 1) add(layer, h('div', { class: 'mline', style: `left:${k * w}px` }));
  }

  const left = h('div', {}), right = h('div', {});

        const v = name.textContent.trim() || '이름 없음';

    h('div', { class: 'tl__sh' },

      h('span', { style: 'display:flex;gap:1px' },
        S.owner ? h('button', { class: 'ico', html: I.plus, title: S.group === 'phase' ? '단계 추가' : '담당자 관리', onClick: () => S.group === 'phase' ? createPhase() : openSettings('members') }) : null,
        h('button', { class: 'ico', html: I.left, title: '패널 접기 (B)', onClick: () => { S.sideMin = true; LS.set('sideMin', true); render(); } }))),
    left,
    h('div', { class: 'grip', id: 'grip', title: '드래그해서 너비 조절 · 더블클릭 초기화' }));

  const main = h('div', { class: 'tl__main', style: `width:${days * w}px` },
    h('div', { class: 'tl__head' }, months, ticks), layer, nowLine, right);

  const wrap = h('div', { class: 'tl' }, side, main);
  if (!lanes.length || (!live().length && !S.phases.length)) {
    return frag(wrap, emptyState('첫 단계를 만들어보세요',
      '단계를 만들고 타임라인 빈 곳을 더블클릭하면 그 날짜에 작업이 생깁니다.',
      S.owner ? { t: '단계 만들기', fn: createPhase } : null, I.cal));
  }
  return wrap;
}

/* 바 드래그: 좌우 = 날짜, 상하 = 레인 이동 */
function barDrag(e, task, bar) {
  if (e.button !== 0) return;
  const edge = e.target.dataset?.edge || null;
  const x0 = e.clientX, y0 = e.clientY;
  const s0 = pd(task.start_date), e0 = pd(task.end_date);
  const left0 = parseFloat(bar.style.left);
  const tip = $('#tip');
  let started = false, ns = s0, ne = e0, target = null, lastN = null;
  const lanes = edge ? [] : $$('.tl__main .lane').filter(n => n.dataset.kind !== 'vac');
  const home = S.group === 'phase' ? (task.phase_id || '__none') : (task.assignee_id || '__none');

  const move = ev => {
    const dx = ev.clientX - x0, dy = ev.clientY - y0;
    if (!started) {
      if (Math.abs(dx) < 5 && Math.abs(dy) < 12) return;
      started = true; S.dragging = true; bar._moved = true; bar.classList.add('is-drag'); hidePop();
      try { bar.setPointerCapture(e.pointerId); } catch {}
    }
    ev.preventDefault();
    const dd = Math.round(dx / S.dayW);
    if (edge === 'l') {
      ns = addD(s0, Math.min(dd, dDiff(s0, e0))); ne = e0;
      bar.style.left = (left0 + dDiff(s0, ns) * S.dayW) + 'px';
      bar.style.width = Math.max((dDiff(ns, ne) + 1) * S.dayW - 2, 10) + 'px';
    } else if (edge === 'r') {
      ns = s0; ne = addD(e0, Math.max(dd, -dDiff(s0, e0)));
      bar.style.width = Math.max((dDiff(ns, ne) + 1) * S.dayW - 2, 10) + 'px';
    } else {
      ns = addD(s0, dd); ne = addD(e0, dd);
      bar.style.left = (left0 + dd * S.dayW) + 'px';
      const hit = lanes.find(n => { const r = n.getBoundingClientRect(); return ev.clientY >= r.top && ev.clientY < r.bottom; });
      const next = hit && hit.dataset.lane !== home ? hit : null;
      if (lastN && lastN !== next) lastN.classList.remove('is-drop');
      if (next) next.classList.add('is-drop');
      lastN = next; target = next?.dataset.lane || null;
    }
    const tn = target ? (S.group === 'phase' ? (phOf(target)?.name || '미분류') : (memOf(target)?.name || '미배정')) : null;
    tip.textContent = `${ns.getMonth() + 1}/${ns.getDate()} → ${ne.getMonth() + 1}/${ne.getDate()} · ${dDiff(ns, ne) + 1}일` + (tn ? `  ⇢ ${tn}` : '');
    tip.style.left = ev.clientX + 'px'; tip.style.top = ev.clientY + 'px';
    tip.classList.add('is-on');
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    tip.classList.remove('is-on'); bar.classList.remove('is-drag');
    if (lastN) lastN.classList.remove('is-drop');
    if (!started) return;
    S.dragging = false;
    const patch = {};
    if (fd(ns) !== task.start_date) patch.start_date = fd(ns);
    if (fd(ne) !== task.end_date) patch.end_date = fd(ne);
    if (target) {
      const id = target === '__none' ? null : target;
      if (S.group === 'phase') patch.phase_id = id;
      else { patch.assignee_id = id; patch.assignee = memOf(id)?.name || ''; }
    }
    if (!Object.keys(patch).length) return render();
    const old = { start_date: task.start_date, end_date: task.end_date, phase_id: task.phase_id, assignee_id: task.assignee_id, assignee: task.assignee };
    upTask(task.id, patch, target ? '옮겼습니다' : '일정을 옮겼습니다', { t: '되돌리기', fn: () => upTask(task.id, old) });
    setTimeout(() => { bar._moved = false; }, 80);
  };
  addEventListener('pointermove', move, { passive: false });
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
}

/* 레인 순서 */
function laneDrag(e, lane) {
  e.preventDefault(); e.stopPropagation();
  const ids = S.group === 'phase' ? S.phases.map(p => p.id) : S.members.filter(m => m.active).map(m => m.id);
  const from = ids.indexOf(lane.id); if (from < 0) return;
  const lefts = $$('.tl__side .lane'), rights = $$('.tl__main .lane');
  const rows = lefts.map((n, i) => ({ node: n, id: rights[i]?.dataset.lane, rect: n.getBoundingClientRect() })).filter(r => ids.includes(r.id));
  const my = rows.findIndex(r => r.id === lane.id);
  const y0 = e.clientY; let started = false, to = my, lastN = null;
  const mv = ev => {
    if (!started) { if (Math.abs(ev.clientY - y0) < 6) return; started = true; rows[my]?.node.classList.add('is-lift'); }
    to = rows.length;
    for (let i = 0; i < rows.length; i++) if (ev.clientY < rows[i].rect.top + rows[i].rect.height / 2) { to = i; break; }
    if (lastN) lastN.classList.remove('is-ins', 'is-ins-b');
    if (to < rows.length) { lastN = rows[to].node; lastN.classList.add('is-ins'); }
    else { lastN = rows[rows.length - 1].node; lastN.classList.add('is-ins-b'); }
  };
  const up = async () => {
    removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
    rows[my]?.node.classList.remove('is-lift');
    if (lastN) lastN.classList.remove('is-ins', 'is-ins-b');
    if (!started) return;
    const next = to > my ? to - 1 : to;
    if (next === my) return;
    const arr = ids.slice(); arr.splice(from, 1); arr.splice(clamp(next, 0, arr.length), 0, lane.id);
    const table = S.group === 'phase' ? 'phases' : 'members';
    const list = S.group === 'phase' ? S.phases : S.members;
    arr.forEach((id, i) => { const o = list.find(x => x.id === id); if (o) o.sort = i; });
    list.sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0));
    render();
    try { for (let i = 0; i < arr.length; i++) await DB.update(table, arr[i], { sort: i }); toast('순서를 바꿨습니다'); }
    catch (err) { toast('순서 저장 실패: ' + err.message, true); await reload(); }
  };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
}

/* 카드 드래그: 칸 이동 + 타임라인으로 끌어 일정 만들기 */
function cardDrag(e, r, card) {
  if (e.pointerType === 'touch') return;
  if (e.button !== 0 || e.target.closest('button')) return;
  const x0 = e.clientX, y0 = e.clientY, ghost = $('#ghost');
  let started = false, lastCol = null, lastLane = null;
  card._moved = false;
  const mv = ev => {
    if (!started) {
      if (Math.abs(ev.clientX - x0) < 7 && Math.abs(ev.clientY - y0) < 7) return;
      started = true; card._moved = true; card.classList.add('is-drag');
      ghost.textContent = r.title; ghost.classList.add('is-on');
    }
    ev.preventDefault();
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    const col = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.col');
    if (lastCol && lastCol !== col) lastCol.classList.remove('is-over');
    if (col) col.classList.add('is-over');
    lastCol = col;
    const lane = laneAt(ev.clientX, ev.clientY);
    if (lastLane && lastLane !== lane) lastLane.classList.remove('is-drop');
    if (lane) lane.classList.add('is-drop');
    lastLane = lane;
  };
  const up = async ev => {
    removeEventListener('pointermove', mv); removeEventListener('pointerup', up);
    ghost.classList.remove('is-on'); card.classList.remove('is-drag');
    if (lastCol) lastCol.classList.remove('is-over');
    if (lastLane) lastLane.classList.remove('is-drop');
    setTimeout(() => { card._moved = false; }, 90);
    if (!started) return;
    const lane = laneAt(ev.clientX, ev.clientY);
    if (lane) return dropOnTimeline(r, lane, ev.clientX);
    const col = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.col');
    if (!col) return;
    await moveToColumn(r, col.dataset.col);
  };
  addEventListener('pointermove', mv, { passive: false });
  addEventListener('pointerup', up);
}
function laneAt(x, y) {
  return $$('.tl__main .lane').find(n => {
    if (n.dataset.kind === 'vac') return false;
    const r = n.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }) || null;
}
async function dropOnTimeline(r, lane, clientX) {
  const track = lane.querySelector('.track'), rect = track.getBoundingClientRect();
  const day = Math.max(0, Math.floor((clientX - rect.left) / S.dayW));
  const start = fd(addD(S.range.s, day));
  const id = lane.dataset.lane === '__none' ? null : lane.dataset.lane;
  const o = { title: r.title, description: r.body, start, days: 3, silent: true };
  if (S.group === 'phase') o.phase_id = id ?? r.phase_id; else { o.assignee_id = id; o.phase_id = r.phase_id; }
  const t = await createTask(o); if (!t) return;
  await upReq(r.id, { task_id: t.id, status: 'planned' });
  toast('일정에 넣었습니다', false, { t: '작업 열기', fn: () => openTask(t.id) });
}
async function moveToColumn(r, col) {
  const cur = rStatus(r);
  if (col === cur) return;
  if (col === 'planned' && !r.task_id) {
    await upReq(r.id, { status: 'planned' });
    toast('진행 중으로 옮겼습니다', false, { t: '타임라인에 일정 잡기', fn: () => scheduleReq(r) });
    return;
  }
  if (col === 'done' && r.task_id) { await upTask(r.task_id, { status: 'done', progress: 100 }); return; }
  if ((col === 'new' || col === 'reviewing') && r.task_id) {
    if (!confirm('잡혀 있는 일정 연결을 해제할까요? 작업 자체는 남습니다.')) return;
    await upReq(r.id, { task_id: null, status: col });
    return;
  }
  await upReq(r.id, { status: col });
  if (col === 'done') await maybeLog(r);
}

/* ── 9. 로그 ────────────────────────────────────────────── */
function logGroups() {
  const done = S.releases.filter(r => (r.status || 'done') === 'done')
    .sort((a, b) => b.released_on.localeCompare(a.released_on) || new Date(b.created_at) - new Date(a.created_at));
  const out = [];
  done.forEach(r => {
    const ver = (r.version || '').trim();
    const key = ver ? 'v:' + ver : 'd:' + r.released_on;
    let g = out.find(x => x.key === key);
    if (!g) { g = { key, version: ver, date: r.released_on, items: [] }; out.push(g); }
    g.items.push(r);
    if (r.released_on > g.date) g.date = r.released_on;
  });
  return out;
}
function viewLog() {

  const pend = S.releases.filter(r => (r.status || 'done') !== 'done').filter(match);
  const groups = logGroups().map(g => ({ ...g, items: g.items.filter(match) })).filter(g => g.items.length);

  if (!groups.length && !pend.length) {
    return emptyState('아직 기록이 없습니다',

function emptyState(title, body, action, icon) {

function threads(list) {
  const byId = Object.fromEntries(list.map(c => [c.id, c]));
  const roots = list.filter(c => !c.parent_id);
  const kids = {};
  list.filter(c => c.parent_id).forEach(c => {
    let p = byId[c.parent_id], g = 0;
    while (p && p.parent_id && g++ < 12) p = byId[p.parent_id];
    if (!p) return;
    (kids[p.id] = kids[p.id] || []).push({ ...c, _to: byId[c.parent_id]?.author });
  });
  return roots.map(r => ({ root: r, replies: (kids[r.id] || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at)) }));
}

/* 휴무일 달력 */
function offCal(t) {
  const s = pd(t.start_date), e = pd(t.end_date);
  const offs = new Set(offOf(t.id));
  const wrap = h('div', { class: 'cal' });
  let cur = new Date(s.getFullYear(), s.getMonth(), 1);
  const guard = 14;
  for (let i = 0; i < guard && cur <= e; i++) {
    const y = cur.getFullYear(), m = cur.getMonth();
    const first = new Date(y, m, 1), lastD = new Date(y, m + 1, 0).getDate();
    const g = h('div', { class: 'cal__g' });
    WD.forEach(w => add(g, h('div', { class: 'cal__w' }, w)));
    for (let k = 0; k < first.getDay(); k++) add(g, h('div', {}));
    for (let d = 1; d <= lastD; d++) {
      const date = new Date(y, m, d), ds = fd(date);
      const inR = date >= s && date <= e, isOff = offs.has(ds);
      add(g, h('div', {
        class: 'cal__d' + (inR ? ' in' : ' out') + (isOff ? ' off' : '') + (ds === today() ? ' today' : ''),
        onClick: inR && S.owner ? () => toggleOff(t, ds) : null
      }, String(d)));
    }
    add(wrap, h('div', { class: 'cal__m' }, h('div', { class: 'cal__t' }, `${y}. ${String(m + 1).padStart(2, '0')}`), g));
    cur = new Date(y, m + 1, 1);
  }
  return wrap;
}
async function toggleOff(t, day) {
  const found = S.offdays.find(o => o.task_id === t.id && o.day === day);
  try {
    if (found) { await DB.remove('offdays', found.id); S.offdays = S.offdays.filter(o => o.id !== found.id); }
    else { const made = await DB.insert('offdays', { task_id: t.id, day, reason: '' }); S.offdays.push(made); }
    render(); renderPanel();
  } catch (e) { toast('저장 실패: ' + e.message, true); }
}

function modal(title, desc, bodyNodes, actions, opt = {}) {
  const m = h('div', { class: 'modal' },
    h('div', { class: 'modal__c', style: opt.width ? `max-width:${opt.width}px` : '' },
      h('h2', {}, title), desc ? h('p', {}, desc) : null,
      ...bodyNodes,
      h('div', { style: 'display:flex;gap:8px;margin-top:14px' }, ...actions)));
  add($('#overlays'), m);
  requestAnimationFrame(() => m.classList.add('is-on'));
  m._close = () => { m.classList.remove('is-on'); setTimeout(() => m.remove(), 240); };
  m.addEventListener('click', e => { if (e.target === m) m._close(); });
  return m;
}

        class: 'ico ico--del', html: I.trash, title: '삭제', onClick: async () => {
          if (!confirm(`${p.name} 님을 삭제할까요?`)) return;
          await DB.remove(list, p.id); S[list] = S[list].filter(x => x.id !== p.id);
          if (list === 'members') S.leaves = S.leaves.filter(l => l.member_id !== p.id);
          render(); window.__redrawSettings?.();
        }
      })));
  });
  add(wrap, h('button', {
    class: 'btn btn--sm btn--full', style: 'margin-top:12px', onClick: async () => {
      const name = prompt(list === 'members' ? '담당자 이름' : '작성자 이름'); if (!name?.trim()) return;
      try {
        const p = await DB.insert(list, { name: name.trim(), color: PAL[S[list].length % PAL.length], sort: S[list].length, active: true });
        S[list].push(p); render(); window.__redrawSettings?.();
      } catch (e) { toast(/duplicate/.test(e.message) ? '이미 있는 이름입니다' : '추가 실패: ' + e.message, true); }
    }
  }, '추가'));
  return wrap;
}
async function savePerson(list, id, patch) {
  const p = S[list].find(x => x.id === id); if (!p) return;
  Object.assign(p, patch);
  try { await DB.update(list, id, patch); } catch (e) { toast('저장 실패: ' + e.message, true); }
  if (list === 'members' && patch.name) S.tasks.filter(t => t.assignee_id === id).forEach(t => t.assignee = patch.name);
  render(); window.__redrawSettings?.();
}
async function movePerson(list, i, dir) {
  const arr = S[list].slice(), j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  S[list] = arr; arr.forEach((x, k) => x.sort = k);
  render(); window.__redrawSettings?.();
  for (let k = 0; k < arr.length; k++) await DB.update(list, arr[k].id, { sort: k });
}
function defaultTab() {
  const d = S.settings;
  const wrap = h('div', {});
  const row = (label, opts, key) => {
    const c = h('div', { class: 'chips' });
    const draw = () => {
      c.textContent = '';
      opts.forEach(([k, t]) => add(c, h('button', {
        class: 'chip', 'aria-pressed': d[key] === k,
        style: d[key] === k ? `background:${cvar('--pri')};color:${cvar('--pri-tx')}` : '',
        onClick: async () => { d[key] = k; draw(); await DB.saveSettings(d); toast('기본값을 저장했습니다'); }
      }, t)));
    };
    draw();
    return h('div', { class: 'fld' }, h('span', { class: 'lb' }, label), c);
  };
  add(wrap, h('p', { style: 'margin-bottom:12px' }, '모두가 처음 접속했을 때 보게 될 화면입니다.'));
  add(wrap, row('기본 보기', [['timeline', '타임라인'], ['board', '요청'], ['log', '로그']], 'view'));
  add(wrap, row('기본 묶기', [['phase', '단계'], ['member', '담당']], 'group'));
  const lbl = h('b', { class: 'mono', style: 'color:var(--tx2)' }, String(d.dayW));
  add(wrap, h('div', { class: 'fld' }, h('span', { class: 'lb' }, '기본 확대 ', lbl),
    h('input', {
      class: 'rng', type: 'range', min: ZMIN, max: ZMAX, value: d.dayW,
      onInput: e => lbl.textContent = e.target.value,
      onChange: async e => { d.dayW = +e.target.value; await DB.saveSettings(d); toast('기본값을 저장했습니다'); }
    })));
  add(wrap, h('button', {
    class: 'btn btn--sm btn--full', onClick: async () => {
      Object.assign(d, { dayW: Math.round(S.dayW), view: S.view, group: S.group, sideW: S.sideW });
      await DB.saveSettings(d); toast('지금 화면을 기본값으로 저장했습니다'); window.__redrawSettings?.();
    }
  }, '지금 보고 있는 화면을 기본값으로'));
  add(wrap, h('div', { class: 'note' }, '개인이 바꾼 확대·보기는 그 세션에서만 유지되고, 새로고침하면 이 기본값으로 돌아옵니다.'));
  return wrap;
}
function archiveTab() {
  const wrap = h('div', {});
  const list = S.tasks.filter(t => t.is_archived);
  if (!list.length) return h('div', { class: 'hint', style: 'text-align:center;padding:20px' }, '보관된 작업이 없습니다.');
  list.forEach(t => add(wrap, h('div', { class: 'prow' },
    h('div', { style: 'flex:1;min-width:0' },
      h('div', { style: 'font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, t.title),
      h('div', { class: 'lrow__d' }, `${t.start_date} → ${t.end_date}`)),
    h('button', { class: 'btn btn--sm', onClick: async () => { await upTask(t.id, { is_archived: false }); window.__redrawSettings?.(); } }, '되돌리기'))));
  return wrap;
}

/* 알림 */
function notifList() {
  if (!S.owner) return [];
  const items = [];
  S.requests.filter(r => !r.read_by_owner && (r.origin || 'request') === 'request').forEach(r => items.push({
    kind: 'req', at: r.created_at, id: r.id, title: '새 요청 · ' + prOf(r.priority).t, sub: r.title, who: r.author
  }));
  S.comments.filter(c => !c.is_owner && !c.read_by_owner).forEach(c => {
    const t = c.task_id && taskOf(c.task_id), r = c.request_id && reqOf(c.request_id);
    if (!t && !r) return;
    items.push({ kind: c.task_id ? 'task' : 'req', at: c.created_at, id: c.task_id || c.request_id, title: (t ? t.title : r.title), sub: c.body.replace(/\n/g, ' '), who: c.author });
  });
  return items.sort((a, b) => new Date(b.at) - new Date(a.at));
}
const notifCount = () => notifList().length;
let notifEl = null;
function toggleNotif() {
  if (notifEl && notifEl.classList.contains('is-on')) return closeNotif();
  if (!notifEl) { notifEl = h('div', { class: 'notif' }); add($('#overlays'), notifEl); }
  const items = notifList();
  notifEl.textContent = '';
  add(notifEl, 
    h('div', { class: 'notif__h' }, h('b', {}, '알림'),
      h('button', { class: 'btn btn--sm', onClick: markAllRead }, '모두 읽음')),
    h('div', { class: 'notif__l' }, items.length ? items.slice(0, 40).map(it => {
      const v = S.viewers.find(x => x.name === it.who);
      return h('button', { class: 'nrow', onClick: () => { closeNotif(); it.kind === 'task' ? openTask(it.id) : (S.view = 'board', render(), openReq(it.id)); } },
        h('span', { class: 'av av--sm', style: `background:${v?.color || cvar('--tx3')}` }, (it.who || '?').charAt(0)),
        h('div', { class: 'nrow__b' },
          h('div', { class: 'nrow__t' }, it.title),
          h('div', { class: 'nrow__s' }, it.sub),
          h('div', { class: 'nrow__d' }, `${it.who} · ${relTime(it.at)}`)));
    }) : h('div', { class: 'hint', style: 'text-align:center;padding:22px' }, '새로운 소식이 없습니다.')));
  notifEl.classList.add('is-on');
  const b = $('.bell button').getBoundingClientRect(), r = notifEl.getBoundingClientRect();
  notifEl.style.left = clamp(b.right - r.width, 8, innerWidth - r.width - 8) + 'px';
  notifEl.style.top = (b.bottom + 8) + 'px';
}
function closeNotif() { notifEl && notifEl.classList.remove('is-on'); }
async function markTaskRead(id) {
  if (!S.owner) { S.seen[id] = cmOfTask(id).length; LS.set('seen', S.seen); return; }
  const ids = S.comments.filter(c => c.task_id === id && !c.is_owner && !c.read_by_owner).map(c => c.id);
  if (!ids.length) return;
  ids.forEach(i => { const c = S.comments.find(x => x.id === i); if (c) c.read_by_owner = true; });
  render();
  for (const i of ids) await DB.update('comments', i, { read_by_owner: true });
}
async function markReqRead(id) {
  if (!S.owner) { S.seen['r' + id] = cmOfReq(id).length; LS.set('seen', S.seen); return; }
  const ids = S.comments.filter(c => c.request_id === id && !c.is_owner && !c.read_by_owner).map(c => c.id);
  ids.forEach(i => { const c = S.comments.find(x => x.id === i); if (c) c.read_by_owner = true; });
  const r = reqOf(id), wasNew = r && !r.read_by_owner;
  if (r) r.read_by_owner = true;
  render();
  for (const i of ids) await DB.update('comments', i, { read_by_owner: true });
  if (wasNew) await DB.update('requests', id, { read_by_owner: true });
}
async function markAllRead() {
  const cids = S.comments.filter(c => !c.is_owner && !c.read_by_owner).map(c => c.id);
  const rids = S.requests.filter(r => !r.read_by_owner).map(r => r.id);
  S.comments.forEach(c => c.read_by_owner = true);
  S.requests.forEach(r => r.read_by_owner = true);
  closeNotif(); render(); toast('모두 읽음으로 표시했습니다');
  for (const i of cids) await DB.update('comments', i, { read_by_owner: true });
  for (const i of rids) await DB.update('requests', i, { read_by_owner: true });
}

const KEYS = [['/', '검색'], ['?', '단축키'], ['Esc', '닫기'], ['1 2 3', '타임라인·요청·로그'],
  ['T', '오늘로'], ['N', '새 작업'], ['R', '요청/계획 추가'], ['B', '패널 접기'],
  ['E', '전체 펼치기'], ['G', '단계↔담당'], ['+ −', '확대·축소'], ['Alt+클릭', '작업 숨기기'],
  ['우클릭', '메뉴'], ['드래그', '일정·칸 이동'], ['⌘/Ctrl+Enter', '댓글 등록']];
function openKeys() {
  const m = modal('단축키', '입력창에 포커스가 없을 때 동작합니다.',
    [h('div', { class: 'keys' }, KEYS.map(([k, d]) => h('div', { class: 'keyrow' }, h('kbd', {}, k), h('span', {}, d))))],
    [h('button', { class: 'btn btn--full', onClick: () => m._close() }, '닫기')], { width: 460 });
}
/* ── 12. 렌더 루프 · 부팅 ───────────────────────────────── */
let shellDone = false;
function render() {
  const root = $('#app');
  if (!shellDone) { root.textContent = ''; add(root, shell()); shellDone = true; }
  else {
    /* 상단바만 부분 갱신 (스크롤·포커스 유지) */
    const old = root.firstElementChild, next = shell();
    old.replaceChild(next.querySelector('.top'), old.querySelector('.top'));
    const demoOld = old.querySelector('.demo'), demoNew = next.querySelector('.demo');
    if (!demoOld && demoNew) add(old, demoNew);
  }
  subbar();
  renderStage();
  const all = live(), done = all.filter(t => t.status === 'done').length;
  const sl = $('#subline');
  if (sl) sl.textContent = all.length ? `작업 ${all.length} · 완료 ${Math.round(done / all.length * 100)}%` : '시작해볼까요';
  applySide();
}
function renderStage() {
  const st = $('#stage'); if (!st) return;
  hidePop();
  const keep = st.scrollLeft, keepY = st.scrollTop;
  st.textContent = '';
  add(st, S.view === 'timeline' ? viewTimeline() : S.view === 'board' ? viewBoard() : viewLog());
  if (S.view === 'timeline') { st.scrollLeft = keep; st.scrollTop = keepY; }
  if (S.view === 'timeline') attachSideGrip();
  $('#unfold')?.remove();
  if (S.view === 'timeline' && S.sideMin) {
    const b = h('button', {
      class: 'unfold', id: 'unfold', html: I.right, title: '패널 열기 (B)',
      onClick: () => { S.sideMin = false; LS.set('sideMin', false); render(); }
    });
    add(document.body, b);
    const r = st.getBoundingClientRect(); b.style.top = (r.top + 8) + 'px';
  }
}
function applySide() {
  document.documentElement.style.setProperty('--side', (innerWidth <= 720 ? Math.min(S.sideW, 118) : S.sideW) + 'px');
}
function attachSideGrip() {
  const g = $('#grip'); if (!g) return;
  g.addEventListener('dblclick', () => { S.sideW = DEF.sideW; LS.set('sideW', S.sideW); applySide(); });
  g.addEventListener('pointerdown', e => {
    e.preventDefault(); g.classList.add('is-on');
    const x0 = e.clientX, w0 = S.sideW;
    const mv = ev => { S.sideW = clamp(Math.round(w0 + ev.clientX - x0), 110, 460); applySide(); };
    const up = () => { g.classList.remove('is-on'); removeEventListener('pointermove', mv); removeEventListener('pointerup', up); LS.set('sideW', S.sideW); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}

async function reload() {
  try {
    const d = await DB.loadAll();
    TBL.forEach(t => S[t] = d[t] || []);
    S.settings = d.settings || { ...DEF };
    S.owner = !!DB.user;
    S.demo = DB.mode === 'demo';
    render();
    if (S.sel) renderPanel();
  } catch (e) {
    toast('데이터를 불러오지 못했습니다: ' + (e.message || e), true);
    if (/ds_offdays|ds_releases|ds_requests|logged|request_id/.test(e.message || ''))
      toast('supabase-migration-v9.sql 을 먼저 실행해주세요', true);
  }
}

function openFromHash() {
  const t = location.hash.match(/t=([0-9a-z-]{6,40})/i);
  if (t && taskOf(t[1])) return openTask(t[1]);
  const r = location.hash.match(/r=([0-9a-z-]{6,40})/i);
  if (r && reqOf(r[1])) { S.view = 'board'; render(); openReq(r[1]); }
}

/* 전역 이벤트 */
addEventListener('pointerdown', e => {
  if (!e.target.closest('#menu')) closeMenu();
  if (!e.target.closest('.notif') && !e.target.closest('.bell')) closeNotif();
}, true);
addEventListener('resize', () => { applySide(); if (S.view === 'timeline') renderStage(); });
addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.key === '/') { e.preventDefault(); S.searchOpen = true; render(); setTimeout(() => $('#q')?.focus(), 60); }
  else if (e.key === '?') { e.preventDefault(); openKeys(); }
  else if (e.key === 'Escape') { closeMenu(); closeNotif(); if (S.sel) closePanel(); else closeModals(); }
  else if (e.key === '1') go('timeline');
  else if (e.key === '2') go('board');
  else if (e.key === '3') go('log');
  else if (k === 't') scrollToday(true);
  else if (k === 'n' && S.owner) { e.preventDefault(); createTask({ phase_id: S.phases[0]?.id || null }); }
  else if (k === 'r') { e.preventDefault(); if (S.view === 'board') $('#qadd')?.focus(); else openNewReq(); }
  else if (k === 'b') { S.sideMin = !S.sideMin; LS.set('sideMin', S.sideMin); render(); }
  else if (k === 'e') { S.expandAll = !S.expandAll; S.expanded.clear(); renderStage(); }
  else if (k === 'g') { S.group = S.group === 'phase' ? 'member' : 'phase'; render(); }
  else if (e.key === '=' || e.key === '+') setZoom(S.dayW * 1.35);
  else if (e.key === '-' || e.key === '_') setZoom(S.dayW / 1.35);
});
document.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  if (!e.target.closest('#stage') || S.view !== 'timeline') return;
  e.preventDefault();
  setZoom(S.dayW * (e.deltaY < 0 ? 1.09 : 1 / 1.09), e.clientX);
}, { passive: false });
let pinch = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && S.view === 'timeline') {
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), w: S.dayW, x: (a.clientX + b.clientX) / 2 };
  }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    setZoom(pinch.w * (Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d), pinch.x);
  }
}, { passive: false });
document.addEventListener('touchend', () => { pinch = null; });
document.addEventListener('scroll', () => { closeMenu(); hidePop(); }, true);

/* 부팅 */
(async function boot() {
  document.documentElement.dataset.theme = LS.get('theme', 'dark');
  $('meta[name=theme-color]').content = document.documentElement.dataset.theme === 'dark' ? '#0B0E13' : '#F4F6F9';
  const liveOk = await DB.init();
  await reload();
  S.dayW = clamp(S.settings.dayW || DEF.dayW, ZMIN, ZMAX);
  S.view = ['timeline', 'board', 'log'].includes(S.settings.view) ? S.settings.view : DEF.view;
  S.group = S.settings.group || DEF.group;
  render();
  DB.subscribe(kind => { if (S.dragging || document.activeElement?.isContentEditable) return; reload(); });
  requestAnimationFrame(() => { scrollToday(false); openFromHash(); });
  $('#boot').classList.add('off');
  if (!liveOk && DB.mode === 'demo') {
    setTimeout(() => toast('데모 데이터로 실행 중입니다. 마음껏 눌러보세요', false), 900);
  }
  if (!S.owner && !vwOf(S.viewerId) && S.viewers.filter(v => v.active).length) setTimeout(openWho, 700);
})();

})();

</script>
