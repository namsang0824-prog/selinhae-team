  const wasNew = !r.read_by_owner; r.read_by_owner = true;
  for (const i of ids) await guard(() => DB.update('comments', i, { read_by_owner: true }));
  if (wasNew) await guard(() => DB.update('requests', id, { read_by_owner: true }));
  render();
}
async function markAllRead() {
  const ids = S.comments.filter(c => !c.is_owner && !c.read_by_owner).map(c => c.id);
  S.comments.forEach(c => { c.read_by_owner = true; });
  closeNotif(); render(); toast('모두 읽음으로 표시했습니다');
  for (const i of ids) await guard(() => DB.update('comments', i, { read_by_owner: true }));
}

const KEYS = [['/', '검색'], ['?', '단축키'], ['Esc', '닫기'], ['1 2 3', '타임라인 · 요청 · 로그'],
  ['T', '오늘로 이동'], ['← →', '앞뒤로 넘기기'], ['N', '새 작업'], ['R', '요청 · 계획 추가'],
  ['B', '왼쪽 패널 접기'], ['E', '카드 모두 펼치기'], ['G', '단계별 ↔ 담당별'], ['+ −', '확대 · 축소'],
  ['Alt + 클릭', '내 화면에서 숨기기'], ['우클릭', '메뉴'], ['⌘ Enter', '댓글 등록']];
function openKeys() {
  const m = modal('단축키', '입력칸 밖에서 누르면 동작해요.',
    h('div', { class: 'keys' }, KEYS.map(([k, d]) => h('div', { class: 'keyrow' }, h('span', { class: 'kbd' }, k), h('span', {}, d)))),
    [h('button', { class: 'btn', onClick: () => m._close() }, '닫기')], { width: 480 });
}

/* ── 13. 렌더 · 부팅 ─────────────────────────────────────── */
function render() {
  if (!S.booted) return;
  let app = $('#app > .app');
  if (!app) {
    app = h('div', { class: 'app' }, h('header'), h('div'), h('div', { class: 'main' }, h('div', { class: 'stage', id: 'stage' })), h('nav'));
    add($('#app'), app);
  }
  const a = document.activeElement;
  const qFocus = a && a.id === 'q' ? { s: a.selectionStart, e: a.selectionEnd } : null;
  app.children[0].replaceWith(topBar());
  app.children[1].replaceWith(subBar());
  app.children[3].replaceWith(tabBar());
  if (qFocus) { const q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(qFocus.s, qFocus.e); } catch {} } }
  renderStage();
  renderPanel();
  updateBadge();
}
function renderStage() {
  const st = $('#stage'); if (!st) return;
  hidePop();
  const keepX = st.scrollLeft, keepY = st.scrollTop;
  const qa = document.activeElement && document.activeElement.id === 'qadd';
  const bx = $('#board')?.scrollLeft || 0;
  st.textContent = '';
  add(st, S.view === 'timeline' ? viewTimeline() : S.view === 'board' ? viewBoard() : viewLog());
  st.scrollLeft = keepX; st.scrollTop = keepY;
  const bd = $('#board'); if (bd) bd.scrollLeft = bx;
  if (qa) $('#qadd')?.focus();
  applySide();
  if (S.view === 'timeline') attachGrip();
  $('#unfold')?.remove();
  if (S.view === 'timeline' && S.sideMin && !isMobile()) {
    const b = h('button', { class: 'unfold', id: 'unfold', html: I.right, title: '왼쪽 패널 열기 (B)', 'aria-label': '왼쪽 패널 열기', onClick: toggleSide });
    add(document.body, b);
    b.style.top = (st.getBoundingClientRect().top + 11) + 'px';
  }
}

/* 탭 제목·파비콘에 새 소식 표시 */
const FAV = n => 'data:image/svg+xml,' + encodeURIComponent(LOGO.replace('</svg>', n ? '<circle cx="26" cy="6" r="6" fill="#EF6461" stroke="#fff" stroke-width="1.5"/></svg>' : '</svg>').replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
let lastBadge = -1;
function updateBadge() {
  const n = S.owner ? notifCount() + navBadge('board') : navBadge('board');
  if (n === lastBadge) return;
  lastBadge = n;
  document.title = (n ? `(${n}) ` : '') + '개발 진행 스케줄';
  const l = $('link[rel=icon]'); if (l) l.href = FAV(n);
}

async function reload() {
  try {
    const d = await DB.loadAll();
    TBL.forEach(t => S[t] = d[t] || []);
    S.settings = { ...DEF, ...(d.settings || {}) };
    S.owner = !!DB.user;
    S.demo = DB.mode === 'demo';
    if (S.sel && ((S.selKind === 'task' && !taskOf(S.sel)) || (S.selKind === 'req' && !reqOf(S.sel)))) closePanel();
    primeSeen();
    render();
  } catch (e) {
    toast('불러오지 못했습니다: ' + (e.message || e), { bad: true });
  }
}
function openFromHash() {
  const t = location.hash.match(/t=([0-9a-z-]{2,40})/i);
  if (t && taskOf(t[1])) return openTask(t[1]);
  const r = location.hash.match(/r=([0-9a-z-]{2,40})/i);
  if (r && reqOf(r[1])) { go('board'); openReq(r[1]); }
}

/* 전역 입력 */
addEventListener('pointerdown', e => {
  if (!e.target.closest('#menu') && (!menuAnchor || !menuAnchor.contains || !menuAnchor.contains(e.target))) closeMenu();
  if (!e.target.closest('.notif') && !e.target.closest('.bell') && !e.target.closest('.inbox')) closeNotif();
}, true);
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { closeMenu(); render(); }, 120); });
addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusSearch(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.key === '/') { e.preventDefault(); focusSearch(); }
  else if (e.key === '?') { e.preventDefault(); openKeys(); }
  else if (e.key === 'Escape') {
    if ($('#menu').classList.contains('is-on')) return closeMenu();
    if (notifEl?.classList.contains('is-on')) return closeNotif();
    if (closeModals()) return;
    if (S.sheet) { S.sheet = null; return renderPanel(); }
    if (S.sel) closePanel();
  }
  else if ($$('.modal').length || S.sel) return;
  else if (e.key === '1') go('timeline');
  else if (e.key === '2') go('board');
  else if (e.key === '3') go('log');
  else if (k === 't' && S.view === 'timeline') scrollToday(true);
  else if (e.key === 'ArrowLeft' && S.view === 'timeline') pan(-1);
  else if (e.key === 'ArrowRight' && S.view === 'timeline') pan(1);
  else if (k === 'n' && S.owner) { e.preventDefault(); createTask({ phase_id: S.group === 'phase' ? (S.phases[0]?.id || null) : null }); }
  else if (k === 'r') { e.preventDefault(); if (S.view === 'board' && $('#qadd')) $('#qadd').focus(); else openNewReq(); }
  else if (k === 'b' && S.view === 'timeline') toggleSide();
  else if (k === 'e' && S.view === 'board') { S.expandAll = !S.expandAll; S.expanded.clear(); render(); }
  else if (k === 'g' && S.view === 'timeline') { S.group = S.group === 'phase' ? 'member' : 'phase'; render(); }
  else if ((e.key === '=' || e.key === '+') && S.view === 'timeline') setZoom(S.dayW * 1.35);
  else if ((e.key === '-' || e.key === '_') && S.view === 'timeline') setZoom(S.dayW / 1.35);
});
function focusSearch() {
  S.searchOpen = true; $('.search')?.classList.add('is-open');
  const q = $('#q'); if (q) { q.focus(); q.select(); }
}
document.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey) || S.view !== 'timeline' || !e.target.closest('#stage')) return;
  e.preventDefault();
  setZoom(S.dayW * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX);
}, { passive: false });
let pinch = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && S.view === 'timeline' && e.target.closest('#stage')) {
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), w: S.dayW, x: (a.clientX + b.clientX) / 2 };
  }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    setZoom(pinch.w * (Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d), pinch.x);
  }
}, { passive: false });
document.addEventListener('touchend', () => { pinch = null; });
document.addEventListener('scroll', e => { if (!e.target.closest || !e.target.closest('#menu')) { closeMenu(); hidePop(); } }, true);
$('#scrim').addEventListener('click', closePanel);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ev => { if (!LS.get('theme', null)) { applyTheme(ev.matches ? 'dark' : 'light'); render(); } });

(async function boot() {
  applyTheme(LS.get('theme', null) || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  await DB.init();
  S.booted = true;
  await reload();
  S.dayW = clamp(Number(S.settings.dayW) || DEF.dayW, ZMIN, ZMAX);
  S.group = S.settings.group || DEF.group;
  if (!LS.get('sideW', null) && S.settings.sideW) S.sideW = clamp(S.settings.sideW, 180, 360);
  S.view = S.owner ? (S.settings.ownerView || DEF.ownerView) : (S.settings.view || DEF.view);
  if (!VIEWS.some(v => v.k === S.view)) S.view = 'timeline';
  S.boardTab = S.owner ? LS.get('boardTabO', 'all') : (me() ? LS.get('boardTabV', 'mine') : 'all');
  render();
  DB.subscribe(kind => {
    if (kind === 'auth') { S.owner = !!DB.user; }
    if (S.dragging) return;
    const a = document.activeElement;
    if (a && (a.isContentEditable || (a.tagName === 'TEXTAREA' && a.value))) return setTimeout(reload, 1500);
    reload();
  });
  requestAnimationFrame(() => { scrollToday(false); openFromHash(); });
  $('#boot').classList.add('off');
  if (!S.owner && !me() && S.viewers.some(v => v.active)) setTimeout(openWho, 600);
})();

})();

</script>
